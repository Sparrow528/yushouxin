name: Sync products data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/build_products.py'
      - '.github/workflows/sync-products.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch products from Supabase
        env:
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_E5fa74SZ-2GmAWWv4T4BdA_P5TS9cm_' }}
          SB_URL: https://xvvwdiqxbhhkgnibhbxi.supabase.co
        run: |
          mkdir -p data
          curl -sS --fail --max-time 60 \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/products?select=*&order=created_at.desc" \
            -o data/_raw.json
          echo "拉取字节数: $(wc -c < data/_raw.json)"

      - name: Build products.json and audit report
        run: python3 .github/scripts/build_products.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data products/images
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore(data): 自动同步产品数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
