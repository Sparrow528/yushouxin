*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#00695c;--brand-dark:#004d40;--ink:#1a1a2e;--muted:#666;--line:#e6e8ea;--bg:#fafafa}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Noto Sans Arabic","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:66px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:17px;color:var(--brand);letter-spacing:1px}
.brand img{height:34px;width:auto}
.nav-links{display:flex;gap:26px;list-style:none;font-size:14px;color:#444}
.nav-links a:hover{color:var(--brand)}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:#fff;color:#555;font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit}
.langs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cta-sm{background:var(--brand);color:#fff!important;padding:7px 16px;border-radius:6px;font-weight:500}
.burger{display:none;border:none;background:none;font-size:22px;cursor:pointer;color:#333}

.hero{background:#fff;border-bottom:1px solid var(--line);padding:80px 0 72px}
.hero h1{font-size:44px;font-weight:500;color:var(--brand);line-height:1.25;letter-spacing:-.5px;max-width:720px}
.hero .lead{font-size:18px;color:#555;margin:20px 0 34px;max-width:640px}
.hero .btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{padding:13px 30px;border-radius:8px;font-size:15px;font-weight:500;transition:all .2s}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover{background:var(--brand-dark)}
.btn-o{border:2px solid var(--brand);color:var(--brand)}
.btn-o:hover{background:var(--brand);color:#fff}
.hero-facts{display:flex;gap:36px;margin-top:48px;flex-wrap:wrap}
.hero-facts div b{display:block;font-size:28px;color:var(--brand);font-weight:500}
.hero-facts div span{font-size:13px;color:var(--muted)}

section{padding:72px 0}
.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.label{font-size:12px;font-weight:500;color:var(--brand);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
h2{font-size:32px;font-weight:500;margin-bottom:14px}
.sub{font-size:16px;color:var(--muted);max-width:660px;margin-bottom:40px}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:26px;transition:all .25s}
.card:hover{border-color:var(--brand)}
.card .tag{font-size:12px;color:var(--brand);letter-spacing:1px;margin-bottom:10px}
.card h3{font-size:18px;font-weight:500;margin-bottom:8px}
.card p{font-size:14px;color:var(--muted)}
.card ul{list-style:none;margin-top:14px;font-size:13px;color:#555}
.card li{padding:3px 0}

.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tier{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;position:relative}
.tier.hot{border:2px solid var(--brand)}
.tier.hot::before{content:attr(data-badge);position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:2px 14px;border-radius:12px;font-size:11px;white-space:nowrap}
.tier .n{font-size:14px;font-weight:500;color:var(--brand);margin-bottom:6px}
.tier .p{font-size:30px;font-weight:500;margin:6px 0}
.tier .p small{font-size:13px;font-weight:400;color:#999}
.tier ul{list-style:none;text-align:left;margin:16px 0;padding:0}
.tier li{font-size:13px;color:#555;padding:4px 0;border-bottom:1px solid #f2f3f4}
.tier li:last-child{border:none}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.citem{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.citem .ic{width:38px;height:38px;flex:none;background:#e8f5e9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.qrbox{background:#f2f8f2;border-radius:14px;padding:28px;text-align:center}
.qrbox img{width:172px;height:172px;border-radius:8px;margin:0 auto 12px}

footer{background:var(--ink);color:rgba(255,255,255,.65);padding:38px 0;text-align:center;font-size:13px}
footer strong{color:#fff}

@media(max-width:960px){
 .grid4,.tiers{grid-template-columns:1fr 1fr}
 .nav-links{display:none}
 .burger{display:block}
 .hero h1{font-size:32px}
 .contact,.grid2{grid-template-columns:1fr}
}
@media(max-width:600px){
 .grid4,.tiers{grid-template-columns:1fr}
 .hero-facts{gap:24px}
}
</style>

function setLang(l){
 var d=DICT[l]||DICT.zh;
 document.documentElement.lang=l;
 document.documentElement.dir=RTL[l]?'rtl':'ltr';
 document.title=TITLES[l]||TITLES.zh;

 var ogd=document.querySelector('meta[property="og:description"]'); if(ogd) ogd.setAttribute('content',DESCS[l]||DESCS.zh);
 document.querySelectorAll('[data-i18n]').forEach(function(el){
  var k=el.getAttribute('data-i18n');
  if(d[k]!==undefined) el.innerHTML=d[k];
 });
 document.querySelectorAll('.langs button').forEach(function(b){
  b.classList.toggle('on',b.getAttribute('data-lang')===l);
 });
 try{ localStorage.setItem('yq_lang',l); }catch(e){}
}

document.querySelectorAll('.langs button').forEach(function(b){
 b.addEventListener('click',function(){ setLang(b.getAttribute('data-lang')); });
});

try{ saved=localStorage.getItem('yq_lang')||'zh'; }catch(e){}
if(!DICT[saved]) saved='zh';
setLang(saved);
</script>
