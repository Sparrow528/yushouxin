<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云桥国际 · 产品管理</title>
<style>
:root{--navy:#1a2332;--gold:#c9a96e;--bg:#f5f6fa;--card:#fff;--border:#e2e5ed;--red:#e74c3c;--green:#27ae60;--text:#333;--muted:#888;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:20px;font-weight:600;}
.header a{color:var(--gold);text-decoration:none;font-size:14px;}
.wrap{max-width:960px;margin:0 auto;padding:24px;}
.stats{display:flex;gap:16px;margin-bottom:24px;}
.stat{background:var(--card);border-radius:10px;padding:16px 20px;flex:1;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.stat .num{font-size:28px;font-weight:700;color:var(--navy);}
.stat .label{font-size:13px;color:var(--muted);margin-top:4px;}
.section-title{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s;}
.btn-primary{background:var(--gold);color:#fff;}.btn-primary:hover{background:#b8943f;}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{background:#c0392b;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.product-list{display:flex;flex-direction:column;gap:10px;}
.product-row{background:var(--card);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.product-row img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#eee;}
.product-row .info{flex:1;min-width:0;}
.product-row .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-row .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.product-row .meta span{margin-right:10px;}
.product-row .actions{display:flex;gap:6px;}
.form-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;}
.form-overlay.show{display:flex;}
.form-box{background:#fff;border-radius:14px;padding:28px;width:92%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.form-box h2{font-size:18px;font-weight:700;margin-bottom:20px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:#555;}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;transition:border .2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none;}
.field textarea{min-height:72px;resize:vertical;}
.row2{display:flex;gap:12px;}.row2 .field{flex:1;}
.lang-tabs{display:flex;gap:6px;margin-bottom:8px;}
.lang-tab{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:#fff;transition:all .15s;}
.lang-tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.lang-group{display:none;}.lang-group.on{display:block;}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:border .2s;position:relative;}
.upload-zone:hover{border-color:var(--gold);}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-zone .hint{color:var(--muted);font-size:13px;}
.preview-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.preview-item{position:relative;width:80px;height:80px;}
.preview-item img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.preview-item .remove{position:absolute;top:-4px;right:-4px;width:18px;height:18px;background:var(--red);color:#fff;border:none;border-radius:50%;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.toggle-row{display:flex;align-items:center;gap:10px;margin:12px 0;}
.toggle{width:40px;height:22px;background:#ccc;border-radius:11px;position:relative;cursor:pointer;transition:background .2s;}
.toggle.on{background:var(--green);}
.toggle .knob{width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.toggle.on .knob{left:20px;}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:10px;color:#fff;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.ok{background:var(--green);}.toast.err{background:var(--red);}
</style>
</head>
<body>
<div class="header">
  <h1>云桥国际 · 产品管理</h1>
  <a href="https://sparrow528.github.io/yushouxin/products/" target="_blank">→ 查看线上网站</a>
</div>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="section-title">
    <span>产品列表</span>
    <button class="btn btn-primary" onclick="openForm()">+ 新增产品</button>
  </div>
  <div class="product-list" id="productList"></div>
</div>

<div class="form-overlay" id="formOverlay">
  <div class="form-box">
    <h2 id="formTitle">新增产品</h2>
    <input type="hidden" id="editId">
    <div class="field">
      <label>所属会员企业</label>
      <select id="fMember"><option value="stage-leather">浙江实达皮革服饰有限公司</option></select>
    </div>
    <div class="field">
      <label>产品分类</label>
      <select id="fCategory">
        <option value="cosmetic">化妆包</option><option value="bags">包类产品</option>
        <option value="school">书包</option><option value="backpack">背包</option>
        <option value="woman">女包</option><option value="clothing">服装纺织</option>
        <option value="beauty">美妆个护</option><option value="home">家居日用</option>
        <option value="food">食品饮料</option><option value="mom_baby">母婴用品</option>
        <option value="electronics">电子电器</option><option value="sports">运动户外</option>
        <option value="furniture">家装建材</option><option value="jewelry">珠宝饰品</option>
        <option value="stationery">办公文教</option><option value="auto">汽车配件</option>
        <option value="other">其他</option>
      </select>
    </div>
    <div class="field">
      <label>产品名称（多语言）</label>
      <div class="lang-tabs"><div class="lang-tab on" data-l="zh" onclick="swTab(this,'name')">中文</div><div class="lang-tab" data-l="en" onclick="swTab(this,'name')">EN</div><div class="lang-tab" data-l="fr" onclick="swTab(this,'name')">FR</div><div class="lang-tab" data-l="ar" onclick="swTab(this,'name')">عربي</div></div>
      <div class="lang-group on" data-g="name" data-l="zh"><input id="fName_zh" placeholder="产品中文名"></div>
      <div class="lang-group" data-g="name" data-l="en"><input id="fName_en" placeholder="Product name"></div>
      <div class="lang-group" data-g="name" data-l="fr"><input id="fName_fr" placeholder="Nom du produit"></div>
      <div class="lang-group" data-g="name" data-l="ar"><input id="fName_ar" placeholder="اسم المنتج" dir="rtl"></div>
    </div>
    <div class="row2">
      <div class="field"><label>价格</label><input id="fPrice" placeholder="¥299"></div>
      <div class="field"><label>规格</label><input id="fSpecs" placeholder="型号A1 / 白色"></div>
    </div>
    <div class="field">
      <label>产品介绍（多语言）</label>
      <div class="lang-tabs"><div class="lang-tab on" data-l="zh" onclick="swTab(this,'desc')">中文</div><div class="lang-tab" data-l="en" onclick="swTab(this,'desc')">EN</div><div class="lang-tab" data-l="fr" onclick="swTab(this,'desc')">FR</div><div class="lang-tab" data-l="ar" onclick="swTab(this,'desc')">عربي</div></div>
      <div class="lang-group on" data-g="desc" data-l="zh"><textarea id="fDesc_zh" placeholder="产品中文介绍"></textarea></div>
      <div class="lang-group" data-g="desc" data-l="en"><textarea id="fDesc_en" placeholder="Product description"></textarea></div>
      <div class="lang-group" data-g="desc" data-l="fr"><textarea id="fDesc_fr" placeholder="Description du produit"></textarea></div>
      <div class="lang-group" data-g="desc" data-l="ar"><textarea id="fDesc_ar" placeholder="وصف المنتج" dir="rtl"></textarea></div>
    </div>
    <div class="field">
      <label>产品图片</label>
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
        <div class="hint">点击或拖拽上传图片（支持多张，建议≤2MB/张）</div>
      </div>
      <div class="preview-grid" id="previewGrid"></div>
    </div>
    <div class="toggle-row">
      <div class="toggle" id="beautifyToggle" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
      <span style="font-size:13px;">AI图片美化（抠图白底 + 清晰度增强）</span>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
      <button class="btn btn-primary" onclick="saveProduct()" style="flex:1;" id="saveBtn">发布产品</button>
      <button class="btn btn-ghost" onclick="closeForm()">取消</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://xvvwdiqxbhhkgnibhbxi.supabase.co';
const SB_KEY='sb_publishable_E5fa74SZ-2GmAWWv4T4BdA_P5TS9cm_';
const SB_H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
const RPC_PW='admin888';
const SB_BUCKET='product-images';

let products=[];
let uploadedImages=[];

function swTab(el,group){
  el.parentElement.querySelectorAll('.lang-tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  var l=el.getAttribute('data-l');
  el.closest('.field').querySelectorAll('.lang-group').forEach(g=>{
    g.classList.toggle('on',g.getAttribute('data-g')===group && g.getAttribute('data-l')===l);
  });
}

function loadProducts(){
  fetch(SB_URL+'/rest/v1/products?select=*&order=created_at.desc',{headers:SB_H})
    .then(r=>r.json()).then(d=>{products=d||[];renderList();renderStats();})
    .catch(()=>{products=[];renderList();renderStats();});
}

function renderStats(){
  var cats={};products.forEach(p=>{cats[p.category]=1;});
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="num">'+products.length+'</div><div class="label">产品总数</div></div>'+
    '<div class="stat"><div class="num">'+Object.keys(cats).length+'</div><div class="label">产品分类</div></div>'+
    '<div class="stat"><div class="num">'+new Set(products.map(p=>p.member_id)).size+'</div><div class="label">会员企业</div></div>';
}

function renderList(){
  var el=document.getElementById('productList');
  if(!products.length){el.innerHTML='<div style="text-align:center;padding:40px;color:#888;">暂无产品，点击右上角新增</div>';return;}
  el.innerHTML='';
  products.forEach(function(p){
    var row=document.createElement('div');row.className='product-row';
    var imgSrc=p.image||'';
    if(!imgSrc) imgSrc='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56"><rect fill="%23eee" width="56" height="56"/><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" fill="%23ccc" font-size="12">N/A</text></svg>';
    row.innerHTML='<img src="'+imgSrc+'" alt=""><div class="info"><div class="name">'+(p.name||'未命名')+'</div><div class="meta"><span>'+p.category+'</span>'+(p.price?'<span>'+p.price+'</span>':'')+'</div></div><div class="actions"><button class="btn btn-ghost" onclick="editProduct('+p.id+')">编辑</button><button class="btn btn-danger" onclick="deleteProduct('+p.id+')">删除</button></div>';
    el.appendChild(row);
  });
}

function openForm(id){
  document.getElementById('formOverlay').classList.add('show');
  document.getElementById('editId').value=id||'';
  document.getElementById('formTitle').textContent=id?'编辑产品':'新增产品';
  document.getElementById('saveBtn').textContent=id?'保存修改':'发布产品';
  if(!id){
    ['fName_zh','fName_en','fName_fr','fName_ar','fPrice','fSpecs','fDesc_zh','fDesc_en','fDesc_fr','fDesc_ar'].forEach(x=>{document.getElementById(x).value='';});
    document.getElementById('fCategory').value='cosmetic';
    document.getElementById('fMember').value='stage-leather';
    uploadedImages=[];renderPreviews();
  }else{
    var p=products.find(x=>x.id===id);
    if(p){
      document.getElementById('fName_zh').value=p.name||'';
      document.getElementById('fName_en').value=p.name_en||'';
      document.getElementById('fName_fr').value=p.name_fr||'';
      document.getElementById('fName_ar').value=p.name_ar||'';
      document.getElementById('fPrice').value=p.price||'';
      document.getElementById('fSpecs').value=p.specs||'';
      document.getElementById('fDesc_zh').value=p.description||'';
      document.getElementById('fDesc_en').value=p.description_en||'';
      document.getElementById('fDesc_fr').value=p.description_fr||'';
      document.getElementById('fDesc_ar').value=p.description_ar||'';
      document.getElementById('fCategory').value=p.category||'cosmetic';
      document.getElementById('fMember').value=p.member_id||'stage-leather';
      uploadedImages=p.image?[{dataUrl:p.image,existing:true}]:[];
      renderPreviews();
    }
  }
}
function closeForm(){document.getElementById('formOverlay').classList.remove('show');}
function editProduct(id){openForm(id);}

function handleFiles(files){
  Array.from(files).forEach(function(file){
    if(file.size>5*1024*1024){toast('图片不能超过5MB','err');return;}
    var reader=new FileReader();
    reader.onload=function(e){
      uploadedImages.push({file:file,dataUrl:e.target.result});
      renderPreviews();
    };
    reader.readAsDataURL(file);
  });
}
function renderPreviews(){
  var grid=document.getElementById('previewGrid');grid.innerHTML='';
  uploadedImages.forEach(function(img,i){
    var d=document.createElement('div');d.className='preview-item';
    d.innerHTML='<img src="'+img.dataUrl+'"><button class="remove" onclick="removeImage('+i+')">×</button>';
    grid.appendChild(d);
  });
}
function removeImage(i){uploadedImages.splice(i,1);renderPreviews();}

/* ===== 上传图片到 Supabase Storage ===== */
async function uploadToStorage(file, category){
  var ts=Date.now()+'_'+Math.random().toString(36).slice(2,6);
  var ext=file.name.split('.').pop()||'png';
  var path=category+'/'+ts+'.'+ext;

  var res=await fetch(SB_URL+'/storage/v1/object/'+SB_BUCKET+'/'+path,{
    method:'POST',
    headers:{
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':file.type||'image/png'
    },
    body:file
  });
  if(!res.ok){
    var err=await res.json().catch(()=>({}));
    throw new Error(err.message||err.error||'Upload failed ('+res.status+')');
  }
  /* 返回公开访问URL */
  return SB_URL+'/storage/v1/object/public/'+SB_BUCKET+'/'+path;
}

/* ===== 保存产品 ===== */
async function saveProduct(){
  var editId=document.getElementById('editId').value;
  var name_zh=document.getElementById('fName_zh').value.trim();
  var name_en=document.getElementById('fName_en').value.trim();
  var name_fr=document.getElementById('fName_fr').value.trim();
  var name_ar=document.getElementById('fName_ar').value.trim();
  var category=document.getElementById('fCategory').value;
  var price=document.getElementById('fPrice').value.trim();
  var specs=document.getElementById('fSpecs').value.trim();
  var desc_zh=document.getElementById('fDesc_zh').value.trim();
  var desc_en=document.getElementById('fDesc_en').value.trim();
  var desc_fr=document.getElementById('fDesc_fr').value.trim();
  var desc_ar=document.getElementById('fDesc_ar').value.trim();
  var member_id=document.getElementById('fMember').value;

  if(!name_zh){toast('请填写产品中文名称','err');return;}

  document.getElementById('saveBtn').disabled=true;
  document.getElementById('saveBtn').textContent='处理中...';
  toast('正在保存...','ok');

  try{
    /* 上传图片 */
    var imageUrls=[];
    for(var i=0;i<uploadedImages.length;i++){
      var img=uploadedImages[i];
      if(img.existing){imageUrls.push(img.dataUrl);continue;}
      if(img.file){
        var url=await uploadToStorage(img.file,category);
        imageUrls.push(url);
      }
    }

    /* 写入 Supabase */
    var productData={
      name:name_zh,
      name_en:name_en||null,name_fr:name_fr||null,name_ar:name_ar||null,
      category:category,price:price||null,specs:specs||null,
      description:desc_zh||null,description_en:desc_en||null,description_fr:desc_fr||null,description_ar:desc_ar||null,
      image:imageUrls[0]||'',images:imageUrls.length>1?imageUrls.join(','):null,
      member_id:member_id
    };

    var action=editId?'update':'insert';
    var rpcBody={password:RPC_PW,action:action,data:productData};
    if(editId) rpcBody.data.id=parseInt(editId);

    var res=await fetch(SB_URL+'/rest/v1/rpc/manage_product',{
      method:'POST',headers:SB_H,body:JSON.stringify(rpcBody)
    });
    var result=await res.json();
    if(res.ok){
      toast(editId?'产品已更新！':'产品已发布！','ok');
      closeForm();loadProducts();
    }else{
      toast('保存失败: '+(result.error||result.msg||JSON.stringify(result)),'err');
    }
  }catch(e){
    toast('错误: '+e.message,'err');
  }finally{
    document.getElementById('saveBtn').disabled=false;
    document.getElementById('saveBtn').textContent=editId?'保存修改':'发布产品';
  }
}

async function deleteProduct(id){
  if(!confirm('确定删除此产品？'))return;
  try{
    var res=await fetch(SB_URL+'/rest/v1/rpc/manage_product',{
      method:'POST',headers:SB_H,body:JSON.stringify({password:RPC_PW,action:'delete',data:{id:id}})
    });
    if(res.ok){toast('已删除','ok');loadProducts();}
    else{var r=await res.json();toast('删除失败: '+(r.error||''),'err');}
  }catch(e){toast('网络错误','err');}
}

function toast(msg,type){
  var el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(type||'ok');
  setTimeout(()=>{el.className='toast';},2500);
}

loadProducts();
</script>
</body>
</html>
