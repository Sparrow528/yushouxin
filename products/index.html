<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云桥国际 · 会员专属平台</title>
<style>
:root{--navy:#0F2544;--navy-l:#1A3A6B;--gold:#C9A24B;--ink:#1A2333;--muted:#6B7686;--line:#E6EAF0;--bg:#F7F8FA;--white:#fff;--price:#E0433F}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
[dir="rtl"] body{font-family:"Segoe UI","Tahoma",system-ui,sans-serif}
.nav{position:fixed;top:0;left:0;right:0;background:var(--navy);color:#fff;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.15);direction:ltr}
.nav-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;direction:ltr}
.brand{font-size:15px;font-weight:800}
.brand .sub{display:block;font-size:10px;font-weight:400;opacity:.7;letter-spacing:1px}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-link{color:#cfd8e6;font-size:13px;text-decoration:none;cursor:pointer;padding:5px 10px;border-radius:6px}
.nav-link.on{color:#fff;background:rgba(255,255,255,.14)}
/* 语言选择器 */
.lang-wrap{position:relative}
.lang-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:4px}
.lang-btn::after{content:'▾';font-size:10px}
.lang-menu{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:6px 0;min-width:100px;display:none;z-index:300;direction:ltr}
.lang-menu.open{display:block}
.lang-opt{display:block;width:100%;padding:8px 14px;font-size:13px;color:var(--ink);background:none;border:none;text-align:left;cursor:pointer;font-weight:500}
[dir="rtl"] .lang-opt{text-align:right}
.lang-opt:hover{background:#f0f2f5}
.lang-opt.on{color:var(--navy);font-weight:700}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
/* 首页 hero */
.hero{padding:96px 20px 36px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-l) 100%);color:#fff;text-align:center}
.hero .logo-zone{font-size:44px;margin-bottom:10px}
.hero h1{font-size:22px;font-weight:800}
.hero .sub{font-size:13px;opacity:.85;margin-top:6px;letter-spacing:1px}
.hero .desc{max-width:640px;margin:14px auto 0;font-size:13px;opacity:.8;padding:0 20px}
/* 分类 tab */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}
.tab{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);cursor:pointer;transition:.2s}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* 产品网格 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .thumb{height:180px;overflow:hidden;background:#E8EDF5}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .info{padding:12px 14px}
.card .nm{font-size:14px;font-weight:700;color:var(--ink);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .by{font-size:11px;color:var(--muted);margin-top:4px}
/* 产品详情弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:0 0 30px;max-height:88vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet .big{width:100%;height:260px;background:#E8EDF5}
.sheet .big img{width:100%;height:100%;object-fit:cover}
.sheet .pd{padding:16px 20px}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet .by{font-size:12px;color:var(--muted);margin-bottom:12px}
.sheet .by a{color:var(--gold);text-decoration:none;font-weight:700;cursor:pointer}
.sheet .lbl{font-size:11px;color:var(--muted);margin:12px 0 4px}
.sheet .desc{font-size:14px;color:var(--ink);line-height:1.7}
.sheet .close{width:calc(100% - 40px);margin:18px 20px 0;padding:13px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
/* 会员企业页 */
.members{display:none}
.members.show{display:block}
.back-btn{display:inline-flex;align-items:center;gap:6px;margin:80px 0 0;padding:8px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}
.m-hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-l) 100%);color:#fff;text-align:center;padding:40px 20px;margin-top:14px;border-radius:14px}
.m-hero .logo-zone{font-size:44px}
.m-hero h2{font-size:22px;font-weight:800;margin-top:10px}
.m-hero .en{font-size:12px;opacity:.8;margin-top:4px}
.m-hero .cat{display:inline-block;margin-top:12px;background:rgba(201,162,75,.2);color:var(--gold);font-size:12px;font-weight:700;padding:4px 14px;border-radius:12px;border:1px solid rgba(201,162,75,.5)}
.m-hero .intro{max-width:680px;margin:16px auto 0;font-size:13px;opacity:.88;text-align:left}
[dir="rtl"] .m-hero .intro{text-align:right}
section{padding:34px 0 6px}
.sec-tag{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.sec-title{font-size:21px;font-weight:800;color:var(--navy);margin:4px 0 4px}
.sec-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gallery .g{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.gallery .g img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .g .cap{font-size:11px;color:var(--muted);padding:6px 10px;text-align:center}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.step{background:#fff;border-radius:10px;padding:14px;border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--gold);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.step .t{font-size:13px;font-weight:700;color:var(--navy)}
.step .d{font-size:11px;color:var(--muted);margin-top:2px}
.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cert-grid .g{background:#fff;border-radius:10px;overflow:hidden;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cert-grid img{width:100%;height:200px;object-fit:contain;padding:10px}
.cert-grid .cap{font-size:13px;font-weight:700;color:var(--navy);padding:8px}
footer{background:var(--navy);color:#7f8ea6;text-align:center;padding:24px 16px;font-size:12px;margin-top:30px}
footer .co{color:#cfd8e6;font-weight:700;font-size:13px;margin-bottom:4px}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.card .price-tag{font-size:14px;font-weight:700;color:var(--price);margin-top:4px}
.sheet .price-big{font-size:22px;font-weight:800;color:var(--price);margin:6px 0}
.sheet .specs{font-size:13px;color:var(--muted);line-height:1.6}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .gallery{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(4,1fr)}
  .hero h1{font-size:28px}
}
</style>
</head>

const langBtn = document.getElementById('langBtn');
const langMenu = document.getElementById('langMenu');
langBtn.onclick = function(e){
  e.stopPropagation();
  langMenu.classList.toggle('open');
};
document.addEventListener('click', ()=> langMenu.classList.remove('open'));

document.querySelectorAll('.lang-opt').forEach(opt=>{
  opt.onclick = function(e){
    e.stopPropagation();
    setLang(this.getAttribute('data-lang'));
    langMenu.classList.remove('open');
  };
});

function setLang(newLang){
  lang = newLang;
  // RTL for Arabic
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  // Update button label
  langBtn.textContent = LANG_LABELS[lang];
  // Highlight current option
  document.querySelectorAll('.lang-opt').forEach(o=>{
    o.classList.toggle('on', o.getAttribute('data-lang') === lang);
  });
  // Apply translations
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent = t(el.getAttribute('data-i18n')));
  renderTabs(); renderProducts(); renderMHero(); renderFactory(); renderQuality(); renderDesign(); renderCert();
}

let allProducts = [];

  cosmetic:'pc_cosmetic', bags:'pc_bags', school:'pc_school', backpack:'pc_backpack', woman:'pc_woman',
  clothing:'pc_clothing', beauty:'pc_beauty', home:'pc_home', food:'pc_food',

/* 静态兜底：Supabase不可用时用本地图片 */
var FALLBACK = [];
[{k:'cosmetic',n:3},{k:'bags',n:2},{k:'school',n:1},{k:'backpack',n:1},{k:'woman',n:1}].forEach(function(c){
  for(var i=1;i<=c.n;i++) FALLBACK.push({id:1000+FALLBACK.length,name:t(CAT_I18N[c.k]||c.k)+' '+i,category:c.k,price:null,description:'',image:'images/'+c.k+'/'+c.k+i+'.png',specs:'',member_id:'stage-leather'});
});
/* 先用兜底数据渲染，Supabase成功后刷新 */
allProducts = FALLBACK.slice();
curCat = 'cosmetic';

function loadProducts(){
  /* 先渲染兜底数据，用户立刻看到内容 */
  renderTabs(); renderProducts();

  /* 再尝试从 Supabase 加载真实产品，与兜底合并 */
  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, 6000);
  fetch(SB_URL+'/rest/v1/products?select=*&order=created_at.desc',{headers:SB_HEADERS,signal:controller.signal})
    .then(function(r){ clearTimeout(timer); if(!r.ok) throw new Error(); return r.json(); })
    .then(function(d){
      if(d && d.length){
        /* 只保留有图片的Supabase产品 */
        var sbProds=d.filter(function(p){return p.image && p.image.length>0;});
        if(sbProds.length){
          /* Supabase产品覆盖的分类 */
          var sbCats={};sbProds.forEach(function(p){sbCats[p.category]=1;});
          /* 兜底中不属于Supabase分类的产品 */
          var remainFb=FALLBACK.filter(function(p){return !sbCats[p.category];});
          allProducts=sbProds.concat(remainFb);
          var cats=getVisibleCats();if(cats.indexOf(curCat)===-1)curCat=cats[0]||'';
          renderTabs();renderProducts();
        }
      }
    })
    .catch(function(){ /* 兜底已在上面渲染 */ });
}
function getVisibleCats(){ var s={}; allProducts.forEach(function(p){s[p.category]=1;}); return Object.keys(s); }

function renderTabs(){
  var box=document.getElementById('ptabs'); box.innerHTML='';
  getVisibleCats().forEach(function(cat){
    var el=document.createElement('div');
    el.className='tab'+(cat===curCat?' on':'');
    el.textContent=t(CAT_I18N[cat]||cat);
    el.onclick=function(){curCat=cat;renderTabs();renderProducts();};
    box.appendChild(el);
  });
}
function renderProducts(){
  var grid=document.getElementById('pgrid');
  var prods=allProducts.filter(function(p){return p.category===curCat;});
  if(!prods.length){grid.innerHTML='<div class="loading">'+t('no_products')+'</div>';return;}
  grid.innerHTML='';
  prods.forEach(function(p){
    var m=MEMBERS.find(function(x){return x.id===p.member_id;})||MEMBERS[0];
    var d=document.createElement('div');d.className='card';
    var ph=p.price?'<div class="price-tag">'+p.price+'</div>':'';
    d.innerHTML='<div class="thumb"><img src="'+p.image+'" loading="lazy" alt="'+p.name+'"></div><div class="info"><div class="nm">'+p.name+'</div>'+ph+'<div class="by">'+t('by').replace('{name}',getMemberName(m))+'</div></div>';
    d.onclick=function(){openDetail(p);}; grid.appendChild(d);
  });
}
function openDetail(p){
  var m=MEMBERS.find(function(x){return x.id===p.member_id;})||MEMBERS[0];
  var ph=p.price?'<div class="price-big">'+p.price+'</div>':'';
  var sh=p.specs?'<div class="lbl">'+t('label_specs')+'</div><div class="specs">'+p.specs+'</div>':'';
  document.getElementById('sheet').innerHTML='<div class="big"><img src="'+p.image+'" alt="'+p.name+'"></div><div class="pd"><h2>'+p.name+'</h2>'+ph+'<div class="by">'+t('by').replace('{name}',getMemberName(m))+' · <a onclick="closeDetail();showMembers()">'+t('view_member')+'</a></div><div class="lbl">'+t('label_desc')+'</div><div class="desc">'+(p.description||t('desc_placeholder'))+'</div>'+sh+'</div><button class="close" onclick="closeDetail()">'+t('close')+'</button>';
  document.getElementById('mask').classList.add('show');
}
function closeDetail(){document.getElementById('mask').classList.remove('show');}
