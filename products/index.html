<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云桥国际 · 会员专属平台</title>
<style>
:root{--navy:#0F2544;--navy-l:#1A3A6B;--gold:#C9A24B;--ink:#1A2333;--muted:#6B7686;--line:#E6EAF0;--bg:#F7F8FA;--white:#fff;--price:#E0433F}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.nav{position:fixed;top:0;left:0;right:0;background:var(--navy);color:#fff;z-index:100;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.nav-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px}
.brand{font-size:15px;font-weight:800}
.brand .sub{display:block;font-size:10px;font-weight:400;opacity:.7;letter-spacing:1px}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-link{color:#cfd8e6;font-size:13px;text-decoration:none;cursor:pointer;padding:5px 10px;border-radius:6px}
.nav-link.on{color:#fff;background:rgba(255,255,255,.14)}
.lang-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;padding:5px 12px;border-radius:6px;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 40px}
/* 首页 hero */
.hero{padding:96px 20px 36px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-l) 100%);color:#fff;text-align:center}
.hero .logo-zone{font-size:44px;margin-bottom:10px}
.hero h1{font-size:22px;font-weight:800}
.hero .sub{font-size:13px;opacity:.85;margin-top:6px;letter-spacing:1px}
.hero .desc{max-width:640px;margin:14px auto 0;font-size:13px;opacity:.8;padding:0 20px}
/* 分类 tab */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}
.tab{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);cursor:pointer;transition:.2s}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* 产品网格 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .thumb{height:180px;overflow:hidden;background:#E8EDF5}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .info{padding:12px 14px}
.card .nm{font-size:14px;font-weight:700;color:var(--ink);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .by{font-size:11px;color:var(--muted);margin-top:4px}
/* 产品详情弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:0 0 30px;max-height:88vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet .big{width:100%;height:260px;background:#E8EDF5}
.sheet .big img{width:100%;height:100%;object-fit:cover}
.sheet .pd{padding:16px 20px}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet .by{font-size:12px;color:var(--muted);margin-bottom:12px}
.sheet .by a{color:var(--gold);text-decoration:none;font-weight:700;cursor:pointer}
.sheet .lbl{font-size:11px;color:var(--muted);margin:12px 0 4px}
.sheet .desc{font-size:14px;color:var(--ink);line-height:1.7}
.sheet .close{width:calc(100% - 40px);margin:18px 20px 0;padding:13px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
/* 会员企业页 */
.members{display:none}
.members.show{display:block}
.back-btn{display:inline-flex;align-items:center;gap:6px;margin:80px 0 0;padding:8px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--navy);font-size:14px;font-weight:600;cursor:pointer}
.m-hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-l) 100%);color:#fff;text-align:center;padding:40px 20px;margin-top:14px;border-radius:14px}
.m-hero .logo-zone{font-size:44px}
.m-hero h2{font-size:22px;font-weight:800;margin-top:10px}
.m-hero .en{font-size:12px;opacity:.8;margin-top:4px}
.m-hero .cat{display:inline-block;margin-top:12px;background:rgba(201,162,75,.2);color:var(--gold);font-size:12px;font-weight:700;padding:4px 14px;border-radius:12px;border:1px solid rgba(201,162,75,.5)}
.m-hero .intro{max-width:680px;margin:16px auto 0;font-size:13px;opacity:.88;text-align:left}
section{padding:34px 0 6px}
.sec-tag{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.sec-title{font-size:21px;font-weight:800;color:var(--navy);margin:4px 0 4px}
.sec-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gallery .g{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.gallery .g img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .g .cap{font-size:11px;color:var(--muted);padding:6px 10px;text-align:center}
.steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.step{background:#fff;border-radius:10px;padding:14px;border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.step .num{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--gold);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.step .t{font-size:13px;font-weight:700;color:var(--navy)}
.step .d{font-size:11px;color:var(--muted);margin-top:2px}
.cert-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cert-grid .g{background:#fff;border-radius:10px;overflow:hidden;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.cert-grid img{width:100%;height:200px;object-fit:contain;padding:10px}
.cert-grid .cap{font-size:13px;font-weight:700;color:var(--navy);padding:8px}
footer{background:var(--navy);color:#7f8ea6;text-align:center;padding:24px 16px;font-size:12px;margin-top:30px}
footer .co{color:#cfd8e6;font-weight:700;font-size:13px;margin-bottom:4px}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .gallery{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(4,1fr)}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-inner">
    <div class="brand"><span data-i18n="brand">云桥国际 · 会员专属平台</span><span class="sub" data-i18n="brand_sub">YUNQIAO INTERNATIONAL MEMBERS PLATFORM</span></div>
    <div class="nav-right">
      <span class="nav-link on" id="navHome" onclick="showHome()" data-i18n="nav_products">产品</span>
      <span class="nav-link" id="navMembers" onclick="showMembers()" data-i18n="nav_members">会员企业</span>
      <button class="lang-btn" id="langBtn">EN</button>
    </div>
  </div>
</div>

<!-- 首页：产品展示 -->
<div class="home" id="home">
  <div class="hero">
    <div class="logo-zone">🌉</div>
    <h1 data-i18n="platform_name">云桥国际文化交流有限公司</h1>
    <div class="sub" data-i18n="platform_sub">会员专属平台 · 优质产品展示</div>
    <div class="desc" data-i18n="platform_desc">精选会员企业优质产品，向海内外意向客户展示。</div>
  </div>
  <div class="wrap">
    <div class="tabs" id="ptabs"></div>
    <div class="grid" id="pgrid"></div>
  </div>
</div>

<!-- 会员企业页 -->
<div class="members" id="members">
  <div class="wrap">
    <button class="back-btn" onclick="showHome()">← <span data-i18n="back">返回产品</span></button>
    <div class="m-hero" id="mHero"></div>
    <section id="secFactory">
      <div class="sec-tag" data-i18n="sec_factory_tag">FACTORY</div>
      <div class="sec-title" data-i18n="factory_title">工厂环境</div>
      <div class="sec-sub" data-i18n="factory_sub">从原料到成品的完整生产线</div>
      <div class="gallery" id="fgrid"></div>
    </section>
    <section id="secQuality">
      <div class="sec-tag" data-i18n="sec_quality_tag">QUALITY</div>
      <div class="sec-title" data-i18n="quality_title">质量控制</div>
      <div class="sec-sub" data-i18n="quality_sub">21年零质量投诉，四道质检把关</div>
      <div class="steps" id="qsteps"></div>
      <div class="sec-title" style="font-size:17px" data-i18n="test_title">测试设备</div>
      <div class="gallery" id="tgrid"></div>
    </section>
    <section id="secDesign">
      <div class="sec-tag" data-i18n="sec_design_tag">DESIGN</div>
      <div class="sec-title" data-i18n="design_title">设计能力</div>
      <div class="sec-sub" data-i18n="design_sub">自有设计团队，支持来样定制</div>
      <div class="gallery" id="dgrid"></div>
    </section>
    <section id="secCert">
      <div class="sec-tag" data-i18n="sec_cert_tag">CERTIFICATES</div>
      <div class="sec-title" data-i18n="cert_title">认证证书</div>
      <div class="sec-sub" data-i18n="cert_sub">通过国际社会责任与商业道德认证</div>
      <div class="cert-grid" id="cgrid"></div>
    </section>
  </div>
</div>

<!-- 产品详情弹窗 -->
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<footer>
  <div class="co" data-i18n="foot_co">云桥国际文化交流有限公司 · 会员专属平台</div>
  <div data-i18n="foot">为会员企业提供产品展示服务</div>
</footer>

<script>
const I18N = {
  zh: {
    brand:'云桥国际 · 会员专属平台', brand_sub:'YUNQIAO INTERNATIONAL MEMBERS PLATFORM',
    nav_products:'产品', nav_members:'会员企业',
    platform_name:'云桥国际文化交流有限公司', platform_sub:'会员专属平台 · 优质产品展示',
    platform_desc:'精选会员企业优质产品，向海内外意向客户展示。',
    back:'返回产品',
    sec_factory_tag:'工厂', factory_title:'工厂环境', factory_sub:'从原料到成品的完整生产线',
    sec_quality_tag:'质量', quality_title:'质量控制', quality_sub:'21年零质量投诉，四道质检把关', test_title:'测试设备',
    sec_design_tag:'设计', design_title:'设计能力', design_sub:'自有设计团队，支持来样定制',
    sec_cert_tag:'证书', cert_title:'认证证书', cert_sub:'通过国际社会责任与商业道德认证',
    foot_co:'云桥国际文化交流有限公司 · 会员专属平台', foot:'为会员企业提供产品展示服务',
    by:'由 {name} 提供', view_member:'查看企业介绍',
    pc_cosmetic:'化妆包', pc_bags:'包类产品', pc_school:'书包', pc_backpack:'背包', pc_woman:'女包',
    fc_sample:'样品间', fc_warehouse:'仓库', fc_cut:'裁剪车间', fc_sew:'缝纫车间', fc_inspect:'检验包装车间',
    qc1t:'原料检验', qc1d:'Raw material inspection', qc2t:'裁剪/印花检验', qc2d:'Cut / print part inspection', qc3t:'生产过程巡检', qc3d:'Patrol inspection during production', qc4t:'成品检验', qc4d:'In-line / Final inspection',
  },
  en: {
    brand:'Yunqiao International', brand_sub:'MEMBERS PLATFORM',
    nav_products:'Products', nav_members:'Members',
    platform_name:'Yunqiao International Cultural Exchange Co., Ltd.', platform_sub:'Members Exclusive Platform · Quality Products',
    platform_desc:'Curated quality products from member enterprises, showcased to customers worldwide.',
    back:'Back to Products',
    sec_factory_tag:'FACTORY', factory_title:'Factory Environment', factory_sub:'Complete production line from raw material to finished goods',
    sec_quality_tag:'QUALITY', quality_title:'Quality Control', quality_sub:'Zero quality complaint in 21 years, 4-stage inspection', test_title:'Testing Equipment',
    sec_design_tag:'DESIGN', design_title:'Design Capability', design_sub:'In-house design team, sample customization supported',
    sec_cert_tag:'CERTIFICATES', cert_title:'Certificates', cert_sub:'BSCI & SMETA certified',
    foot_co:'Yunqiao International Cultural Exchange Co., Ltd. · Members Platform', foot:'Product display service for member enterprises',
    by:'Provided by {name}', view_member:'View Company',
    pc_cosmetic:'Cosmetic Bags', pc_bags:'Bag Products', pc_school:'School Bags', pc_backpack:'Backpacks', pc_woman:'Woman Bags',
    fc_sample:'Sample Room', fc_warehouse:'Warehouse', fc_cut:'Cut Workshop', fc_sew:'Sewing Workshop', fc_inspect:'Inspect & Package Workshop',
    qc1t:'Raw material inspection', qc1d:'', qc2t:'Cut / print part inspection', qc2d:'', qc3t:'Patrol inspection', qc3d:'', qc4t:'Final inspection', qc4d:'',
  }
};
let lang = 'zh';
function t(k){ return I18N[lang][k] || k; }
function switchLang(){
  lang = lang==='zh'?'en':'zh';
  document.getElementById('langBtn').textContent = lang==='zh'?'EN':'中';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent = t(el.getAttribute('data-i18n')));
  renderTabs(); renderProducts(); renderMHero(); renderFactory(); renderQuality(); renderDesign(); renderCert();
}
document.getElementById('langBtn').onclick = switchLang;

// ============ 会员 + 产品数据 ============
const MEMBERS = [
  {
    id:'stage-leather', name:'浙江实达皮革服饰有限公司', nameEn:'ZHEJIANG STAGE LEATHER APPAREL CO., LTD.',
    category:'箱包制造', categoryEn:'Bags Manufacturing', emoji:'🧳',
    intro:'2004年成立，21年专注服饰/箱包的设计、开发与生产，通过 BSCI、SMETA 认证。',
    introEn:'Established in 2004, 21 years specializing in clothes/bags design, development and production. BSCI & SMETA certified.',
  }
];
const PROD_CATS = [
  {key:'cosmetic', count:17, cap:'pc_cosmetic'},
  {key:'bags', count:6, cap:'pc_bags'},
  {key:'school', count:2, cap:'pc_school'},
  {key:'backpack', count:2, cap:'pc_backpack'},
  {key:'woman', count:2, cap:'pc_woman'},
];
let curCat = 'cosmetic';

function showHome(){ document.getElementById('home').style.display='block'; document.getElementById('members').classList.remove('show'); document.getElementById('navHome').classList.add('on'); document.getElementById('navMembers').classList.remove('on'); window.scrollTo(0,0); }
function showMembers(){ document.getElementById('home').style.display='none'; document.getElementById('members').classList.add('show'); document.getElementById('navMembers').classList.add('on'); document.getElementById('navHome').classList.remove('on'); window.scrollTo(0,0); renderMHero(); renderFactory(); renderQuality(); renderDesign(); renderCert(); }

// ============ 产品 ============
function renderTabs(){
  const box = document.getElementById('ptabs');
  box.innerHTML = '';
  PROD_CATS.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'tab' + (c.key===curCat?' on':'');
    el.textContent = t(c.cap);
    el.onclick = ()=>{ curCat=c.key; renderTabs(); renderProducts(); };
    box.appendChild(el);
  });
}
function renderProducts(){
  const grid = document.getElementById('pgrid');
  const c = PROD_CATS.find(x=>x.key===curCat);
  grid.innerHTML = '';
  const m = MEMBERS[0];
  for(let i=1;i<=c.count;i++){
    const d = document.createElement('div');
    d.className='card';
    d.innerHTML = `
      <div class="thumb"><img src="images/${c.key}/${c.key}${i}.png" loading="lazy" alt=""></div>
      <div class="info"><div class="nm">${t(c.cap)} ${i}</div><div class="by">${t('by').replace('{name}', lang==='zh'?m.name:m.nameEn)}</div></div>`;
    d.onclick = ()=>openDetail(c, i);
    grid.appendChild(d);
  }
}
function openDetail(c, i){
  const m = MEMBERS[0];
  document.getElementById('sheet').innerHTML = `
    <div class="big"><img src="images/${c.key}/${c.key}${i}.png" alt=""></div>
    <div class="pd">
      <h2>${t(c.cap)} ${i}</h2>
      <div class="by">${t('by').replace('{name}', lang==='zh'?m.name:m.nameEn)} · <a onclick="closeDetail();showMembers()">${t('view_member')}</a></div>
      <div class="lbl">${lang==='zh'?'产品介绍':'Description'}</div>
      <div class="desc">${lang==='zh'?'（产品介绍待补充）':'(Description to be added)'}</div>
    </div>
    <button class="close" onclick="closeDetail()">${lang==='zh'?'关闭':'Close'}</button>`;
  document.getElementById('mask').classList.add('show');
}
function closeDetail(){ document.getElementById('mask').classList.remove('show'); }
document.getElementById('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeDetail(); });

// ============ 会员企业 ============
function renderMHero(){
  const m = MEMBERS[0];
  document.getElementById('mHero').innerHTML = `
    <div class="logo-zone">${m.emoji}</div>
    <h2>${lang==='zh'?m.name:m.nameEn}</h2>
    <div class="en">${lang==='zh'?m.nameEn:m.name}</div>
    <div class="cat">${lang==='zh'?m.category:m.categoryEn}</div>
    <div class="intro">${lang==='zh'?m.intro:m.introEn}</div>`;
}
const FACTORY = [{n:3,cap:'fc_sample'},{n:2,cap:'fc_warehouse'},{n:2,cap:'fc_cut'},{n:2,cap:'fc_sew'},{n:2,cap:'fc_inspect'}];
function renderFactory(){
  const grid = document.getElementById('fgrid');
  grid.innerHTML = '';
  let idx = 0;
  FACTORY.forEach(f=>{
    for(let i=0;i<f.n;i++){
      idx++;
      const d = document.createElement('div');
      d.className='g';
      d.innerHTML = `<img src="images/factory/factory${idx}.png" loading="lazy" alt=""><div class="cap">${t(f.cap)}</div>`;
      grid.appendChild(d);
    }
  });
}
function renderQuality(){
  const steps = document.getElementById('qsteps');
  steps.innerHTML = '';
  for(let i=1;i<=4;i++){
    steps.innerHTML += `<div class="step"><div class="num">${i}</div><div><div class="t">${t('qc'+i+'t')}</div><div class="d">${t('qc'+i+'d')}</div></div></div>`;
  }
  const grid = document.getElementById('tgrid');
  grid.innerHTML = '';
  for(let i=2;i<=6;i++){
    const d = document.createElement('div');
    d.className='g';
    d.innerHTML = `<img src="images/quality/quality${i}.png" loading="lazy" alt="testing">`;
    grid.appendChild(d);
  }
}
function renderDesign(){
  const grid = document.getElementById('dgrid');
  grid.innerHTML = '';
  for(let i=1;i<=26;i++){
    const d = document.createElement('div');
    d.className='g';
    d.innerHTML = `<img src="images/design/design${i}.png" loading="lazy" alt="design">`;
    grid.appendChild(d);
  }
}
function renderCert(){
  const grid = document.getElementById('cgrid');
  grid.innerHTML = '';
  for(let i=1;i<=4;i++){
    const nm = i<=2 ? 'BSCI' : 'SMETA';
    const d = document.createElement('div');
    d.className='g';
    d.innerHTML = `<img src="images/cert/cert${i}.png" loading="lazy" alt="${nm}"><div class="cap">${nm}</div>`;
    grid.appendChild(d);
  }
}

// 初始化
renderTabs(); renderProducts();
</script>
</body>
</html>
