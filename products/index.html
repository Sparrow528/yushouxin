<!doctype html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云桥国际 · 产品目录</title>
<meta name="description" content="云桥国际会员企业产品目录 — 按品类、会员企业检索产品，直接在线询价。">
<meta property="og:type" content="website">
<meta property="og:title" content="云桥国际 · 产品目录">
<meta property="og:description" content="云桥国际会员企业产品目录 — 按品类、会员企业检索产品，直接在线询价。">
<meta property="og:image" content="https://sparrow528.github.io/yushouxin/assets/yunqiao-logo.png">
<meta property="og:url" content="https://sparrow528.github.io/yushouxin/products/">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="../assets/icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/icon-180.png">
<!-- 不依赖外部字体：Google Fonts 在国内不可达，用系统字体保证首屏与外语回退都稳定 -->
<style>
:root{
  --paper:#EEECE9;
  --surface:#FFFFFF;
  --navy:#0F2544;
  --navy-l:#1A3A6B;
  --ink:#0F2544;
  --body:#4B5563;
  --muted:#6E7683;
  --rule:#D5CFC2;
  --rule-strong:#A79E8B;
  --green:#00695C;
  --green-d:#00544A;
  --gold:#C9A24B;
  --chip:#E4DFD6;
  --danger:#B3261E;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC','Segoe UI',system-ui,sans-serif;
  background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:0;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ============ 页头 ============ */
.hd{background:var(--navy);border-top:2px solid var(--gold);position:sticky;top:0;z-index:60}
.hd-in{max-width:1376px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:30px}
.hd-brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.hd-brand img{height:24px;width:auto}
.hd-brand span{color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.hd-title{color:#fff;font-size:19px;font-weight:700;letter-spacing:.2px;padding-inline-start:22px;border-inline-start:1px solid rgba(255,255,255,.18);white-space:nowrap}
.hd-nav{display:flex;gap:22px;align-items:center}
.hd-nav a{color:rgba(255,255,255,.66);font-size:13.5px;padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
.hd-nav a.on,.hd-nav a:hover{color:#fff;border-bottom-color:rgba(255,255,255,.85)}
.hd-nav a.on{font-size:19px;font-weight:700;letter-spacing:.2px}
.hd-right{margin-inline-start:auto;display:flex;gap:5px;align-items:center}
.lang-btn{background:none;border:1px solid transparent;color:rgba(255,255,255,.62);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:3px;cursor:pointer;transition:.15s}
.lang-btn:hover{color:#fff;border-color:rgba(255,255,255,.35)}
.lang-btn.on{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.25)}

/* ============ 检索区 ============ */
.seek{background:var(--paper);border-bottom:1px solid var(--rule)}
.seek-in{max-width:1376px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:10px}
.seek-field{position:relative;flex:1;max-width:560px}
.seek-field svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.seek-field input{width:100%;height:36px;padding-inline:34px 12px;border:1px solid var(--rule-strong);border-radius:0;background:#fff;color:var(--ink);font-size:13.5px;font-family:inherit}
.seek-field input::placeholder{color:#9AA0A8}
.btn-search{height:36px;padding:0 20px;border:0;border-radius:0;background:var(--navy);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
.btn-search:hover{background:var(--navy-l)}
.seek-count{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
.seek-count b{color:var(--ink);font-weight:700}

/* ============ 分类条 ============ */
.catbar-wrap{position:relative;background:var(--paper);border-bottom:1px solid var(--rule)}
.catbar{max-width:1376px;margin:0 auto;padding:0 32px;height:48px;display:flex;align-items:center;gap:22px}
.catbar-scroll{display:flex;align-items:center;gap:22px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.catbar-scroll::-webkit-scrollbar{display:none}
.cat-chip{border:0;background:none;padding:0;color:var(--body);font-size:13.5px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:baseline;gap:5px}
.cat-chip:hover{color:var(--ink)}
.cat-chip.on{color:var(--green);font-weight:700}
.cat-chip .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn-allcats{flex-shrink:0;height:32px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:0;background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-allcats:hover{border-color:var(--ink)}
.btn-allcats svg{width:14px;height:14px}

/* ============ 全部品类面板 ============ */
.panel{display:none;position:absolute;inset-inline-end:32px;top:100%;width:720px;max-width:calc(100vw - 64px);background:#fff;border:1px solid var(--rule-strong);box-shadow:0 14px 36px rgba(15,37,68,.16);z-index:70}
.panel.show{display:block}
.panel-search{padding:12px;border-bottom:1px solid var(--rule)}
.panel-search .seek-field{max-width:none}
.panel-search input{height:36px}
.panel-all{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 14px;border:0;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.panel-all .n{font-size:12px;color:rgba(255,255,255,.85)}
.panel-body{max-height:min(58vh,420px);overflow-y:auto;padding:6px 14px 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px;align-items:start;scrollbar-width:thin}
.panel-body::-webkit-scrollbar{width:6px}
.panel-body::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.pgrp{margin-bottom:12px}
.pgrp-h{display:flex;align-items:center;justify-content:space-between;height:26px;border-bottom:1px solid var(--rule-strong);font-size:12.5px;font-weight:700;color:var(--ink)}
.pgrp-h .n{font-size:11.5px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.pitem{display:flex;align-items:center;justify-content:space-between;width:100%;height:26px;padding:0 5px;border:0;background:none;font-size:12.5px;color:var(--body);cursor:pointer;text-align:start}
.pitem:hover{background:var(--chip);color:var(--ink)}
.pitem.on{background:var(--green);color:#fff;font-weight:700}
.pitem.on .n{color:rgba(255,255,255,.85)}
.pitem .n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.panel-foot{padding:8px 14px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}

/* ============ 条件行 ============ */
.cond{background:var(--paper);border-bottom:1px solid var(--rule)}
.cond-in{max-width:1376px;margin:0 auto;padding:0 32px;height:44px;display:flex;align-items:center;gap:8px}
.chip-sel{height:30px;padding:0 11px;border:0;border-radius:0;background:var(--green);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.chip-sel .n{color:rgba(255,255,255,.85);font-weight:500}
.sel{height:30px;padding-inline:9px;border:1px solid var(--rule-strong);border-radius:0;background:#fff;color:var(--body);font-size:12.5px;font-family:inherit;cursor:pointer}
.cond-range{margin-inline-start:auto;font-size:12.5px;color:var(--muted)}
.cond-range b{color:var(--ink);font-weight:700}

/* ============ 目录表 ============ */
.table{max-width:1376px;margin:0 auto;padding:0 32px}
#rows{min-height:624px}
.thead,.row{display:grid;grid-template-columns:minmax(0,1fr) 252px 176px 188px;align-items:center;gap:16px}
.thead{height:34px;border-bottom:1px solid var(--rule-strong);font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.thead .ta{text-align:end}
.row{min-height:104px;border-bottom:1px solid var(--rule);cursor:pointer}
.row:hover{background:rgba(255,255,255,.55)}
.row:focus-visible{background:#fff}
.p-cell{display:flex;align-items:center;gap:16px;min-width:0;padding:12px 0}
.p-thumb{width:80px;height:80px;flex:none;background:#fff;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;padding:4px}
.p-thumb img{width:100%;height:100%;object-fit:contain}
.p-thumb .noimg{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.3;padding:3px}
.p-txt{min-width:0}
.p-name{font-size:15.5px;font-weight:600;line-height:1.4;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-spec{font-family:inherit;font-size:12.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.c-member{font-size:13px;color:var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-member:hover{color:var(--green);text-decoration:underline;text-underline-offset:3px}
.c-cat{min-width:0}
.tag-cat{display:inline-block;max-width:100%;padding:3px 9px;background:#fff;border:1px solid var(--rule-strong);font-size:11.5px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  -webkit-clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);
  clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px)}
.c-act{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.lnk{font-size:13px;font-weight:600;color:var(--green);white-space:nowrap}
.lnk:hover{color:var(--green-d);text-decoration:underline;text-underline-offset:3px}
.btn-inq{height:34px;padding:0 12px;border:0;border-radius:0;background:var(--green);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-inq:hover{background:var(--green-d)}
.btn-inq svg{width:14px;height:14px}
.empty{padding:64px 0;text-align:center;color:var(--muted);font-size:13.5px}

/* ============ 分页 ============ */
.pager{max-width:1376px;margin:0 auto;padding:16px 32px 40px;display:flex;align-items:center;gap:14px}
.pager-info{font-size:12.5px;color:var(--muted)}
.pager-info b{color:var(--ink);font-weight:700}
.pager-btns{margin-inline-start:auto;display:flex;align-items:center;gap:4px}
.pg{min-width:30px;height:30px;padding:0 7px;border:1px solid var(--rule-strong);border-radius:0;background:#fff;color:var(--body);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pg:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.pg.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.pg:disabled{opacity:.4;cursor:default}
.pg.dots{border:0;background:none;cursor:default}
.pg svg{width:13px;height:13px}

/* ============ 抽屉 ============ */
.scrim{position:fixed;inset:0;background:rgba(15,37,68,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:560px;max-width:100%;background:#fff;border-inline-start:1px solid var(--rule-strong);box-shadow:-10px 0 32px rgba(15,37,68,.16);z-index:100;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .24s cubic-bezier(.2,0,0,1);visibility:hidden}
[dir="rtl"] .drawer{transform:translateX(-105%);box-shadow:10px 0 32px rgba(15,37,68,.16)}
.drawer.show{transform:translateX(0);visibility:visible}
.d-head{flex:none;height:64px;padding:0 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff}
.d-head h2{font-size:15px;font-weight:700;letter-spacing:.3px}
.d-actions{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.d-link{background:none;border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.9);font-size:12px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;border-radius:0}
.d-link:hover{background:rgba(255,255,255,.12);color:#fff}
.d-link svg{width:13px;height:13px}
.d-close{background:none;border:0;color:rgba(255,255,255,.8);cursor:pointer;padding:5px;display:inline-flex}
.d-close:hover{color:#fff}
.d-close svg{width:18px;height:18px}
.d-body{flex:1;overflow-y:auto;padding:20px}
.d-img{height:278px;border:1px solid var(--rule);background:#fff;display:flex;align-items:center;justify-content:center;padding:10px}
.d-img img{max-width:100%;max-height:100%;object-fit:contain}
.d-img .noimg{color:var(--muted);font-size:12.5px}
.d-name{font-size:20px;font-weight:700;line-height:1.35;margin-top:16px;letter-spacing:-.2px}
.d-by{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.d-by a{color:var(--green);font-weight:600}
.d-by a:hover{text-decoration:underline;text-underline-offset:3px}
.d-sep{height:1px;background:var(--rule);margin:16px 0 14px}
.d-lbl{font-size:11.5px;color:var(--muted);letter-spacing:.5px;margin-bottom:6px}
.d-desc{font-size:13.5px;color:var(--body);line-height:1.75}
.spec-row{display:flex;align-items:baseline;justify-content:space-between;gap:20px;min-height:42px;padding:10px 0;border-bottom:1px solid var(--rule)}
.spec-row:last-child{border-bottom:0}
.spec-k{font-size:12.5px;color:var(--muted);flex:none}
.spec-v{font-family:inherit;font-size:13.5px;color:var(--ink);font-weight:500;text-align:end;font-variant-numeric:tabular-nums}
.d-foot{flex:none;border-top:1px solid var(--rule-strong);padding:14px 20px 18px;background:var(--paper)}
.d-foot .to{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.d-foot .to b{color:var(--ink);font-weight:600}
.inq-row{display:flex;gap:8px}
.inq-row input{flex:1;min-width:0;height:38px;padding:0 10px;border:1px solid var(--rule-strong);border-radius:0;background:#fff;color:var(--ink);font-size:13px;font-family:inherit}
.inq-row input.qty{flex:0 0 96px}
.inq-row input::placeholder{color:#9AA0A8}
.btn-send{height:38px;padding:0 16px;border:0;border-radius:0;background:var(--green);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-send:hover{background:var(--green-d)}
.btn-send svg{width:14px;height:14px}
.inq-msg{font-size:11.5px;color:var(--green);margin-top:7px;min-height:14px}

/* ============ 会员企业视图（沿用原有内容）============ */
.members{display:none}
.members.show{display:block}
.m-wrap{max-width:1376px;margin:0 auto;padding:22px 32px 40px}
.back-btn{display:inline-flex;align-items:center;gap:7px;margin-bottom:16px;padding:6px 12px;background:#fff;border:1px solid var(--rule-strong);color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:0}
.back-btn:hover{border-color:var(--ink)}
/* 会员索引：与产品目录同一套行式排布 */
.m-thead,.mrow{display:grid;grid-template-columns:minmax(0,1fr) 260px 110px 150px;align-items:center;gap:16px}
.m-thead{height:34px;border-bottom:1px solid var(--rule-strong);font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.mrow{min-height:74px;border-bottom:1px solid var(--rule);cursor:pointer}
.mrow:hover{background:rgba(255,255,255,.55)}
.mrow .m-name{font-size:15px;font-weight:600;line-height:1.4}
.mrow .m-en{font-size:11.5px;color:var(--muted);letter-spacing:.4px;margin-top:3px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .m-ind{font-size:12.5px;color:var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .m-cnt{font-size:13px;color:var(--body)}
.mrow .m-act{justify-self:end}
/* 会员详情：白面页眉，深蓝只留顶部一道结构线 */
.m-head{background:#fff;border:1px solid var(--rule);border-top:2px solid var(--navy);padding:24px}
.m-head h2{font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.2px}
.m-head .en{font-size:11.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:7px}
.m-head .meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.m-head .m-stat{font-size:12.5px;color:var(--muted)}
.m-head .m-bd{margin-top:16px;padding-top:16px;border-top:1px solid var(--rule)}
.m-head .intro{max-width:920px;font-size:13.5px;line-height:1.85;color:var(--body)}
.m-head .m-acts{margin-top:16px}
.m-head .m-acts .lnk{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--rule-strong);background:#fff;color:var(--ink);font-size:12.5px;text-decoration:none}
.m-head .m-acts .lnk:hover{border-color:var(--ink);color:var(--ink);text-decoration:none}
.m-sec{padding-top:28px}
.m-sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--rule-strong);padding-bottom:8px;margin-bottom:14px}
.m-sec-h h2{font-size:16px;font-weight:700;color:var(--navy)}
.m-sec-h .n{font-size:12px;color:var(--muted);text-align:end}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mcard{background:#fff;border:1px solid var(--rule);cursor:pointer}
.mcard:hover{border-color:var(--rule-strong)}
.mcard .th{height:170px;display:flex;align-items:center;justify-content:center;padding:8px;border-bottom:1px solid var(--rule)}
.mcard .th img{max-width:100%;max-height:100%;object-fit:contain}
.mcard .in{padding:11px 12px 13px}
.mcard .nm{font-size:13.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.mcard .sp{font-size:11.5px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.gallery .g{background:#fff;border:1px solid var(--rule)}
.gallery .g img{width:100%;height:150px;object-fit:cover}
.gallery .g .cap{font-size:11px;color:var(--muted);padding:6px 10px;text-align:center}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.steps .step{background:#fff;border:1px solid var(--rule);padding:13px;display:flex;gap:10px;align-items:flex-start}
.steps .num{width:24px;height:24px;flex:none;background:#fff;border:1px solid var(--rule-strong);color:var(--navy);font-weight:700;font-size:11.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.steps .t{font-size:12.5px;font-weight:700;color:var(--navy)}
.steps .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cert-grid .g{background:#fff;border:1px solid var(--rule);text-align:center}
.cert-grid .g img{width:100%;height:170px;object-fit:contain;padding:8px}
.cert-grid .g .cap{font-size:12px;font-weight:700;color:var(--navy);padding:7px}

/* ============ 市场/服务 iframe ============ */
.framemask{position:fixed;inset:0;background:#fff;z-index:150;display:none;flex-direction:column}
.framemask.show{display:flex}
.framebar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--navy);color:#fff;flex-shrink:0}
.frame-title{font-size:14px;font-weight:700}
.frame-close{background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;line-height:1}
#frameBox{flex:1;width:100%;border:none}

/* ============ 页脚 ============ */
footer{border-top:2px solid var(--navy);background:var(--paper)}
.foot-in{max-width:1376px;margin:0 auto;padding:22px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot-in strong{color:var(--ink);font-weight:700;font-size:12.5px}
.foot-links{margin-inline-start:auto;display:flex;gap:20px;flex-wrap:wrap}
.foot-links a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ============ 响应式 ============ */
@media(max-width:1180px){
  .thead,.row{grid-template-columns:minmax(0,1fr) 200px 150px 168px}
  .catbar{gap:16px}
}
@media(max-width:900px){
  .hd-in{padding:0 16px;gap:14px;height:58px}
  .hd-title{display:none}
  .hd-nav{gap:14px}
  .hd-nav a:nth-child(n+3){display:none}
  .seek-in,.cond-in,.catbar,.table,.pager,.m-wrap,.foot-in{padding-inline:16px}
  .panel{inset-inline:16px;width:auto}
  .panel-body{grid-template-columns:repeat(2,minmax(0,1fr));max-height:300px}
  .thead{display:none}
  .row{grid-template-columns:1fr;gap:0;padding:12px 0;min-height:0}
  .p-cell{padding:0 0 8px;gap:12px}
  .p-thumb{width:64px;height:64px}
  .c-member{font-size:12.5px;color:var(--muted)}
  .c-cat{margin:4px 0 10px}
  .c-act{justify-content:flex-start;gap:14px}
  .cond-range{display:none}
  .drawer{width:100%}
  /* 会员索引改两列，行业列收起，避免窄屏横向溢出 */
  .m-thead{display:none}
  .mrow{grid-template-columns:minmax(0,1fr) 72px;gap:8px;min-height:0;padding:14px 0}
  .mrow .m-ind{display:none}
  .mrow .m-cnt{justify-self:end;font-size:12.5px;color:var(--muted)}
  .mrow .m-act{grid-column:1 / -1;justify-self:start;margin-top:6px}
  .mrow .m-en{white-space:normal}
  .m-head{padding:18px}
  .m-head h2{font-size:20px}
  .hd-right{gap:2px}
  .lang-btn{padding:3px 6px;font-size:10.5px}
  .cond-in{height:auto;flex-wrap:wrap;padding-block:8px;gap:6px}
  .chip-sel{max-width:100%;flex:0 0 auto}
  .sel{flex:1 1 44%;max-width:calc(50% - 3px);min-width:0}
  .catbar{gap:10px}
}
@media(max-width:600px){
  .hd-in{padding:0 12px;gap:10px}
  .hd-brand span{display:none}
  .hd-nav a:nth-child(n+2){display:none}

  .btn-send{width:100%;justify-content:center}
}

function $(id){ return document.getElementById(id); }
function fmt(key, map){
  var s = t(key);
  Object.keys(map || {}).forEach(function(k){ s = s.replace('{' + k + '}', map[k]); });
  return s;
}
/* 单复数：英语/法语在 n===1 时用单独词条，其余语言沿用原模板 */
function nText(key, n){
  if(n === 1){
    var one = t(key + '_one');
    if(one && one !== key + '_one') return fmt(key + '_one', { n:n });
  }
  return fmt(key, { n:n });
}
function catLabel(cat){
  if(!cat) return t('all_cats');

  return key ? t(key) : cat;
}
function memberOf(p){
  var m = MEMBERS.filter(function(x){ return x.id === p.member_id; })[0];
  /* 修：会员未登记时不再冒充第一家，直接显示简码，避免张冠李戴 */
  return m || { id:p.member_id || 'unknown', name:p.member_id || '—', nameEn:p.member_id || '—' };
}
function memberName(p){
  var m = memberOf(p);
  if(m.nameEn && !MEMBERS.some(function(x){ return x.id === m.id; })) return m.name;
  return getMemberName(m);
}
function specText(p){
  var s = p.specs;
  if(!s) return '';
  if(typeof s === 'string'){
    if(s.charAt(0) === '{'){ try{ s = JSON.parse(s); }catch(e){ return s; } }
    else return s;
  }
  if(typeof s === 'object'){
    return Object.keys(s).slice(0, 2).map(function(k){ return k + ' ' + s[k]; }).join(' · ');
  }
  return '';
}
function specList(p){
  var s = p.specs;
  if(!s) return [];
  if(typeof s === 'string'){
    if(s.charAt(0) === '{'){ try{ s = JSON.parse(s); }catch(e){ return [{k:t('label_specs'), v:s}]; } }
    else return s.split('|').map(function(part){
      var i = part.indexOf(':');
      return i > 0 ? { k:part.slice(0, i).trim(), v:part.slice(i + 1).trim() } : { k:'', v:part.trim() };
    });
  }
  if(typeof s === 'object'){
    return Object.keys(s).map(function(k){ return { k:k, v:s[k] }; });
  }
  return [];
}
function imgOf(p){
  if(!p.image) return '';

  var groups = CATEGORY_GROUPS.map(function(g){
    var items = g.cats.filter(function(c){ return cats.indexOf(c) !== -1; });
    items.forEach(function(c){ used[c] = 1; });
    return { key:g.key, label:groupLabel(g), items:items };
  }).filter(function(g){ return g.items.length; });
  /* 修：库里出现但前端没登记的新品类，自动落到「其他」，不再静默消失 */
  var orphans = cats.filter(function(c){ return !used[c]; });
  if(orphans.length){
    var other = groups.filter(function(g){ return g.key === 'other'; })[0];
    if(other) other.items = other.items.concat(orphans);
    else groups.push({ key:'other', label:groupLabel({ key:'other', label:'其他' }), items:orphans });
  }
  return groups;
}
function countIn(cat){
  return allProducts.filter(function(p){ return p.category === cat; }).length;
}

/* ---------- 过滤 ---------- */
function filtered(){
  var list = allProducts.slice();
  if(curCat) list = list.filter(function(p){ return p.category === curCat; });
  if(curMember) list = list.filter(function(p){ return p.member_id === curMember; });
  if(curQuery){
    var q = curQuery.toLowerCase();
    list = list.filter(function(p){
      return [getProductName(p), p.name, p.description, p.specs, catLabel(p.category), memberName(p)]
        .join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }
  if(curSort === 'member'){
    list.sort(function(a, b){ return String(memberName(a)).localeCompare(String(memberName(b)), 'zh'); });
  }else if(curSort === 'new'){
    list.sort(function(a, b){ return (b.id || 0) - (a.id || 0); });
  }else{
    /* 默认：按数据原序（products.json 的 id 升序），不做任何编辑性排序 */
    list.sort(function(a, b){ return (a.id || 0) - (b.id || 0); });
  }
  return list;
}

/* ---------- 渲染 ---------- */
function renderCatBar(){
  var groups = buildTree();
  var html = '';
  groups.slice(0, 9).forEach(function(g){
    var n = g.items.reduce(function(s, c){ return s + countIn(c); }, 0);
    var active = g.items.indexOf(curCat) !== -1;
    html += '<button class="cat-chip' + (active ? ' on' : '') + '" data-group="' + g.key + '">' +
            g.label + '<span class="n">' + n + '</span></button>';
  });
  $('catBar').innerHTML = html;
  /* 固定一层监听：#catBar 重建后依然有效，避免「重渲染 + 文档级关闭」同时触发导致面板闪退 */
  if(!$('catBar').getAttribute('data-bound')){
    $('catBar').setAttribute('data-bound', '1');
    $('catBar').addEventListener('click', function(e){
      var btn = e.target.closest && e.target.closest('.cat-chip');
      if(!btn) return;
      var g = buildTree().filter(function(x){ return x.key === btn.getAttribute('data-group'); })[0];
      if(!g) return;
      if(g.items.length === 1){ setCat(g.items[0]); return; }
      openPanel(g.key);
    });
  }
}
function renderPanel(){
  var groups = buildTree();
  var q = ($('catQ').value || '').trim().toLowerCase();
  var html = '';
  groups.forEach(function(g){
    var items = g.items.filter(function(c){ return !q || catLabel(c).toLowerCase().indexOf(q) !== -1; });
    if(!items.length) return;
    var n = g.items.reduce(function(s, c){ return s + countIn(c); }, 0);
    html += '<div class="pgrp" data-g="' + g.key + '"><div class="pgrp-h"><span>' + g.label + '</span>' +
            (q ? '' : '<span class="n">' + n + '</span>') + '</div>';
    items.forEach(function(c){
      html += '<button class="pitem' + (c === curCat ? ' on' : '') + '" data-cat="' + c + '">' +
              '<span>' + catLabel(c) + '</span><span class="n">' + countIn(c) + '</span></button>';
    });
    html += '</div>';
  });
  $('panelBody').innerHTML = html || '<div class="empty" style="grid-column:1/-1">' + t('no_results') + '</div>';
  Array.prototype.forEach.call($('panelBody').querySelectorAll('.pitem'), function(b){
    b.onclick = function(){ setCat(b.getAttribute('data-cat')); closePanel(); };
  });
  $('panelAllN').textContent = allProducts.length;
  $('panelFoot').textContent = fmt('total_cats', { n: visibleCats().length });
}
function renderCond(){
  $('chipCatTxt').textContent = curCat ? catLabel(curCat) : t('all_products');
  $('chipCatN').textContent = filtered().length;

  var opts = '<option value="">' + t('all_members') + '</option>';
  MEMBERS.forEach(function(m){
    if(!allProducts.some(function(p){ return p.member_id === m.id; })) return;
    opts += '<option value="' + m.id + '"' + (curMember === m.id ? ' selected' : '') + '>' + getMemberName(m) + '</option>';

    '<option value="new"' + (curSort === 'new' ? ' selected' : '') + '>' + t('sort_new') + '</option>' +
    '<option value="member"' + (curSort === 'member' ? ' selected' : '') + '>' + t('sort_member') + '</option>';

function renderRows(){
  var list = filtered();
  var total = list.length;
  var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(curPage > pages) curPage = pages;
  var start = (curPage - 1) * PAGE_SIZE;
  var slice = list.slice(start, start + PAGE_SIZE);

  if(!slice.length){
    $('rows').innerHTML = '<div class="empty">' + t('no_results') + '</div>';
  }else{
    $('rows').innerHTML = slice.map(function(p){
      var spec = specText(p);
      return '<div class="row" data-id="' + p.id + '" tabindex="0" role="button" aria-label="' + getProductName(p).replace(/"/g, '&quot;') + '">' +
        '<div class="p-cell">' + thumbHtml(p) +
          '<div class="p-txt"><div class="p-name">' + getProductName(p) + '</div>' +
          (spec ? '<div class="p-spec">' + spec + '</div>' : '') +
        '</div></div>' +
        '<div class="c-member">' + memberName(p) + '</div>' +
        '<div class="c-cat"><span class="tag-cat">' + catLabel(p.category) + '</span></div>' +
        '<div class="c-act">' +
          '<span class="lnk">' + t('view') + '</span>' +
          '<button class="btn-inq" data-inq="' + p.id + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M22 6l-10 7L2 6"></path></svg>' +
            t('inquire') + '</button>' +
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call($('rows').querySelectorAll('.row'), function(row){
      var id = Number(row.getAttribute('data-id'));
      row.onclick = function(e){
        if(e.target.closest('[data-inq]')) return;
        openProduct(id);
      };
      row.onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openProduct(id); } };
    });
    Array.prototype.forEach.call($('rows').querySelectorAll('[data-inq]'), function(b){
      b.onclick = function(e){ e.stopPropagation(); openProduct(Number(b.getAttribute('data-inq'))); $('inqEmail').focus(); };
    });
  }

  $('totalAll').textContent = allProducts.length;
  $('pagerInfo').innerHTML = total ? fmt('items_range', { a:start + 1, b:Math.min(start + PAGE_SIZE, total), t:total }) : '';
  $('condRange').innerHTML = '<b class="num">' + total + '</b> / ' + allProducts.length;

  var btns = '';
  btns += '<button class="pg" data-p="' + (curPage - 1) + '"' + (curPage <= 1 ? ' disabled' : '') + ' aria-label="上一页">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"></path></svg></button>';
  var win = [];
  for(var i = 1; i <= pages; i++){
    if(i === 1 || i === pages || Math.abs(i - curPage) <= 1) win.push(i);
  }
  var prev = 0;
  win.forEach(function(i){
    if(prev && i - prev > 1) btns += '<span class="pg dots">…</span>';
    btns += '<button class="pg' + (i === curPage ? ' on' : '') + '" data-p="' + i + '">' + i + '</button>';
    prev = i;
  });
  btns += '<button class="pg" data-p="' + (curPage + 1) + '"' + (curPage >= pages ? ' disabled' : '') + ' aria-label="下一页">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"></path></svg></button>';

  Array.prototype.forEach.call($('pagerBtns').querySelectorAll('.pg[data-p]'), function(b){
    b.onclick = function(){
      var p = Number(b.getAttribute('data-p'));
      if(p < 1 || p > pages) return;
      curPage = p; renderRows(); syncURL();
      window.scrollTo({ top:0, behavior:'smooth' });
    };
  });

/* ---------- 抽屉 ---------- */
function openProduct(id){
  var p = allProducts.filter(function(x){ return x.id === id; })[0];
  if(!p) return;
  openId = id;
  var m = memberOf(p);
  var name = getProductName(p);
  var desc = getProductDesc(p);
  var specs = specList(p);
  var src = imgOf(p);

  var html = '';
  html += src
    ? '<div class="d-img"><img src="' + src + '" alt="' + name.replace(/"/g, '&quot;') + '" decoding="async"></div>'
    : '<div class="d-img"><div class="noimg">' + catLabel(p.category) + '</div></div>';
  html += '<h3 class="d-name">' + name + '</h3>';
  html += '<div class="d-by"><a href="#" id="dMemberLink">' + memberName(p) + '</a>' +
          '<span>·</span><span>' + catLabel(p.category) + '</span></div>';
  if(desc) html += '<div class="d-sep"></div><div class="d-lbl">' + t('label_desc') + '</div><div class="d-desc">' + desc + '</div>';
  if(specs.length){
    html += '<div class="d-sep"></div><div class="d-lbl">' + t('label_specs') + '</div>';
    html += specs.map(function(s){
      return '<div class="spec-row"><span class="spec-k">' + (s.k || '') + '</span><span class="spec-v">' + s.v + '</span></div>';
    }).join('');
  }
  $('dBody').innerHTML = html;
  $('dTo').textContent = memberName(p);
  $('inqMsg').textContent = '';
  $('inqQty').value = '';
  $('dMemberLink').onclick = function(e){
    e.preventDefault();
    var mid = p.member_id;
    closeDrawer();
    if(MEMBERS.some(function(x){ return x.id === mid; })){
      selectedMember = MEMBERS.filter(function(x){ return x.id === mid; })[0];
      showMembers();
    }
  };

  $('scrim').classList.add('show');
  $('drawer').classList.add('show');
  document.body.style.overflow = 'hidden';
  if(history.replaceState) history.replaceState(null, '', buildURL(id));
  $('dClose').focus();
}
function closeDrawer(){
  openId = null;
  $('scrim').classList.remove('show');
  $('drawer').classList.remove('show');
  document.body.style.overflow = '';
  if(history.replaceState) history.replaceState(null, '', buildURL(null));
}
function copyLink(){
  if(!openId) return;
  var url = location.origin + location.pathname + buildURL(openId);
  function done(){ $('inqMsg').textContent = t('copied'); }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, function(){ window.prompt(t('copy_link'), url); });
  }else{
    window.prompt(t('copy_link'), url);
  }
}
function buildURL(id){
  var q = [];
  if(id) q.push('p=' + id);
  if(lang !== 'zh') q.push('lang=' + lang);
  if(curCat) q.push('cat=' + encodeURIComponent(curCat));
  if(curMember) q.push('member=' + encodeURIComponent(curMember));
  if(curQuery) q.push('q=' + encodeURIComponent(curQuery));
  if(curPage > 1) q.push('page=' + curPage);
  return q.length ? '?' + q.join('&') : location.pathname.replace(/[^/]*$/, '');
}
function syncURL(){ if(history.replaceState && !openId) history.replaceState(null, '', buildURL(null)); }

/* ---------- 询价（mailto，零后端） ---------- */
function sendInquiry(){
  var email = ($('inqEmail').value || '').trim();
  if(!email || email.indexOf('@') === -1){
    $('inqMsg').style.color = 'var(--danger)';
    $('inqMsg').textContent = t('need_email');
    $('inqEmail').focus();
    return;
  }
  var p = allProducts.filter(function(x){ return x.id === openId; })[0];
  if(!p) return;
  var link = location.origin + location.pathname + buildURL(openId);
  var body = [
    t('mail_body') + ': ' + getProductName(p),
    'ID: ' + p.id,
    'Member: ' + memberName(p),
    'Category: ' + catLabel(p.category),
    'Link: ' + link,
    '',
    ($('inqQty').value ? 'Qty: ' + $('inqQty').value : ''),
    'From: ' + email
  ].join('\n');
  var subject = '[Inquiry] ' + getProductName(p) + ' / ' + memberName(p);
  location.href = 'mailto:' + INQUIRE_EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  $('inqMsg').style.color = 'var(--green)';
  $('inqMsg').textContent = t('send') + ' → ' + INQUIRE_EMAIL;
}

/* ---------- 数据加载 ---------- */
function applyProducts(raw){
  if(!raw || !raw.length) throw new Error('empty');
  var prods = raw.slice();
  /* 修：不再丢弃无图产品（缩略图已有占位块），也不再用 memberLimit 默认 10 静默截断 */
  var cap = { 'liangzi-dongli':30, 'shinong-seed':200, 'herun-bolan':12, 'zhixue-school':30, 'mulinsen':130 };
  var counts = {};
  prods = prods.filter(function(p){
    var mid = p.member_id || 'unknown';
    if(!cap[mid]) return true;
    counts[mid] = (counts[mid] || 0) + 1;
    return counts[mid] <= cap[mid];
  });
  /* 兜底品类：库里一条都没有的品类，用本地图补上，避免整组空白 */
  var has = {};
  prods.forEach(function(p){ has[p.category] = 1; });
  FALLBACK.forEach(function(f){ if(!has[f.category]) prods.push(f); });
  prods.forEach(function(p){ if(!p.member_id) p.member_id = 'unknown'; });
  allProducts = prods;
  try{ localStorage.setItem('yq_products', JSON.stringify(prods)); }catch(e){}
}
function loadProducts(){
  $('rows').innerHTML = '<div class="empty">' + t('loading') + '</div>';
  var cached = null;
  try{ cached = JSON.parse(localStorage.getItem('yq_products') || 'null'); }catch(e){}

  function done(){
    renderAll();
    applyDeepLink();
  }
  fetch('../data/products.json', { cache:'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('no-static'); return r.json(); })
    .then(function(j){ return j && j.products ? j.products : null; })
    .then(function(list){ applyProducts(list); done(); })
    .catch(function(){
      fetch(SB_URL + '/rest/v1/products?select=*&order=created_at.desc', { headers:SB_HEADERS })
        .then(function(r){ if(!r.ok) throw new Error('sb-fail'); return r.json(); })
        .then(function(list){ applyProducts(list); done(); })
        .catch(function(){
          if(cached && cached.length){ allProducts = cached; done(); }
          else { allProducts = FALLBACK.slice(); done(); }
        });
    });
}

/* ---------- 深链 ---------- */
function applyDeepLink(){
  var sp = new URLSearchParams(location.search);
  var l = sp.get('lang');
  if(l && LANGS.indexOf(l) !== -1){ lang = l; applyText(); }
  var c = sp.get('cat'); if(c){ curCat = c; }
  var m = sp.get('member'); if(m){ curMember = m; }
  var q = sp.get('q'); if(q){ curQuery = q; $('q').value = q; }
  var pg = Number(sp.get('page')); if(pg > 0){ curPage = pg; }
  renderAll();
  var p = Number(sp.get('p'));
  if(p) openProduct(p);
}

/* ---------- 事件绑定 ---------- */
function bind(){
  $('btnSearch').onclick = function(){
    curQuery = ($('q').value || '').trim(); curPage = 1;
    renderCond(); renderRows(); syncURL();
  };
  $('q').onkeydown = function(e){ if(e.key === 'Enter') $('btnSearch').click(); };
  $('catQ').oninput = renderPanel;
  $('btnAllCats').onclick = function(){ $('catPanel').classList.contains('show') ? closePanel() : openPanel(); };
  $('panelAll').onclick = function(){ setCat(''); closePanel(); };
  $('chipCat').onclick = openPanel;
  $('selMember').onchange = function(){
    curMember = $('selMember').value; curPage = 1;
    renderCond(); renderRows(); syncURL();
  };
  $('selSort').onchange = function(){
    curSort = $('selSort').value; curPage = 1;
    renderRows(); syncURL();
  };
  $('dClose').onclick = closeDrawer;
  $('scrim').onclick = closeDrawer;
  $('dCopy').onclick = copyLink;
  $('btnSend').onclick = sendInquiry;
  $('navCatalog').onclick = function(e){ e.preventDefault(); showCatalog(); };
  $('navMembers').onclick = function(e){ e.preventDefault(); selectedMember = null; showMembers(); };
  $('footMembers').onclick = function(e){ e.preventDefault(); selectedMember = null; showMembers(); };
  $('navMarket').onclick = function(e){ e.preventDefault(); openFrame('market.html', t('nav_market')); };
  $('navServices').onclick = function(e){ e.preventDefault(); openFrame('services.html', t('nav_services')); };
  $('frameClose').onclick = closeFrame;
  $('backBtn').onclick = function(){ selectedMember = null; showCatalog(); };
  document.addEventListener('click', function(e){
    /* 目标节点已从 DOM 移除（重渲染导致）时不算「点外面」，否则面板会被自己关掉 */
    if(!document.contains(e.target)) return;
    if(!e.target.closest('.catbar-wrap') && !e.target.closest('#chipCat')) closePanel();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if($('drawer').classList.contains('show')) closeDrawer();
      else if($('catPanel').classList.contains('show')) closePanel();
      else if($('framemask').classList.contains('show')) closeFrame();
    }
  });
  window.addEventListener('popstate', function(){
    if(openId) closeDrawer();
    applyDeepLink();
  });
}

/* ---------- 启动 ---------- */
applyText();
bind();
loadProducts();
</script>
