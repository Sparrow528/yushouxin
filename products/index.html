<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品展示平台</title>
<style>
:root{--primary:#2F6BFF;--primary-d:#1E4FD6;--ink:#1A2333;--muted:#7A8699;--line:#E8EDF5;--bg:#F5F7FB;--card:#fff;--price:#E0433F}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.topbar{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-d) 100%);color:#fff;padding:28px 20px 22px;text-align:center}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:1px}
.topbar p{font-size:13px;opacity:.85;margin-top:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
/* 分类筛选 */
.cats{display:flex;gap:8px;overflow-x:auto;padding:14px 0;margin:0 -14px;padding-left:14px;padding-right:14px;background:var(--bg);position:sticky;top:0;z-index:10}
.cat{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);cursor:pointer;transition:all .2s;white-space:nowrap}
.cat.on{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 产品网格 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(26,35,51,.06);cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:active{transform:scale(.97)}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.thumb .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.35);color:#fff;font-size:11px;padding:3px 10px;border-radius:12px;backdrop-filter:blur(4px)}
.info{padding:12px 14px}
.name{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:17px;font-weight:800;color:var(--price)}
/* 详情弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:20px 20px 30px;max-height:85vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet .big-thumb{height:200px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:16px}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:8px}
.sheet .p{font-size:20px;font-weight:800;color:var(--price);margin-bottom:12px}
.sheet .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.sheet .desc{font-size:15px;color:var(--ink);margin-bottom:14px;line-height:1.7}
.sheet .specs{font-size:13px;color:var(--muted);background:#F5F7FB;padding:10px 14px;border-radius:8px}
.sheet .close{width:100%;margin-top:18px;padding:13px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.foot{text-align:center;font-size:12px;color:#B8C0CC;margin-top:28px}
</style>
</head>
<body>
<div class="topbar">
  <h1>产品展示平台</h1>
  <p>精选优质产品，欢迎选购</p>
</div>

<div class="wrap">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">— 更多产品持续更新 —</div>
</div>

<div class="mask" id="mask">
  <div class="sheet" id="sheet"></div>
</div>

<script>
// 写死的示例产品数据（后续接 Supabase 后可替换）
const PRODUCTS = [
  {name:'智能温控器', price:'¥299', category:'智能家居', desc:'手机APP远程控制，节能省电，支持语音助手，定时开关。', specs:'型号 A1 · 白色 · 2年质保', emoji:'🌡️', color:'#E8F1FF'},
  {name:'智能门锁', price:'¥899', category:'智能家居', desc:'指纹 + 密码 + APP 多种开锁方式，C 级锁芯，安全防盗。', specs:'型号 L1 · 黑色', emoji:'🔒', color:'#EEF0FF'},
  {name:'智能灯泡', price:'¥79', category:'智能家居', desc:'可调色温亮度，语音控制，节能省电。', specs:'型号 B3 · 暖白', emoji:'💡', color:'#FFF7E6'},
  {name:'空气净化器', price:'¥399', category:'健康家电', desc:'负离子净化，静音运行，适合办公室和卧室。', specs:'型号 B2 · 黑色 · 滤芯可换', emoji:'🌿', color:'#E8F8F1'},
  {name:'加湿器', price:'¥199', category:'健康家电', desc:'大雾量，静音运行，缺水自动断电。', specs:'型号 H1 · 白色', emoji:'💧', color:'#E8F5FF'},
  {name:'电饭煲', price:'¥499', category:'厨房电器', desc:'IH 电磁加热，智能预约，多种烹饪模式。', specs:'型号 R1 · 4L', emoji:'🍚', color:'#FFF1E8'},
  {name:'破壁机', price:'¥699', category:'厨房电器', desc:'大功率，豆浆米糊果汁一机搞定。', specs:'型号 P2 · 1.5L', emoji:'🥤', color:'#F5EEFF'},
  {name:'电水壶', price:'¥129', category:'厨房电器', desc:'快速烧水，恒温保温，304 不锈钢。', specs:'型号 K1 · 1.7L', emoji:'🫖', color:'#E8F4FF'},
];

let curCat = '全部';
const catsBox = document.getElementById('cats');
const grid = document.getElementById('grid');

function renderCats(){
  const cats = ['全部', ...new Set(PRODUCTS.map(p=>p.category))];
  catsBox.innerHTML = '';
  cats.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'cat' + (c===curCat?' on':'');
    el.textContent = c;
    el.onclick = ()=>{ curCat=c; renderCats(); renderGrid(); };
    catsBox.appendChild(el);
  });
}

function renderGrid(){
  const list = curCat==='全部' ? PRODUCTS : PRODUCTS.filter(p=>p.category===curCat);
  grid.innerHTML = '';
  list.forEach((p,i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb" style="background:${p.color}">
        <span class="tag">${p.category}</span>
        <span>${p.emoji}</span>
      </div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="price">${p.price}</div>
      </div>`;
    card.onclick = ()=>openDetail(p);
    grid.appendChild(card);
  });
}

function openDetail(p){
  document.getElementById('sheet').innerHTML = `
    <div class="big-thumb" style="background:${p.color}">${p.emoji}</div>
    <h2>${p.name}</h2>
    <div class="p">${p.price}</div>
    <div class="lbl">产品介绍</div>
    <div class="desc">${p.desc}</div>
    <div class="lbl">规格参数</div>
    <div class="specs">${p.specs}</div>
    <button class="close" onclick="closeDetail()">关闭</button>`;
  document.getElementById('mask').classList.add('show');
}

function closeDetail(){ document.getElementById('mask').classList.remove('show'); }
document.getElementById('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeDetail(); });

renderCats();
renderGrid();
</script>
</body>
</html>
