<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>云桥国际 · 海外市场</title>
<style>
:root{--navy:#1a2332;--gold:#c9a96e;--bg:#f5f6fa;--card:#fff;--border:#e2e5ed;--red:#e74c3c;--green:#27ae60;--text:#333;--muted:#888;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* 导航 */
.nav{background:var(--navy);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;direction:ltr;}
.nav.brand{color:#fff;font-size:16px;font-weight:600;text-decoration:none;}
.nav.links{display:flex;gap:16px;align-items:center;}
.nav.links a{color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;transition:color.2s;}
.nav.links a:hover,.nav.links a.on{color:var(--gold);}
.lang-dd{position:relative;display:inline-block;}
.lang-btn{background:rgba(255,255,255,.1);color:#fff;border:none;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
.lang-menu{display:none;position:absolute;right:0;top:100%;background:#fff;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15);margin-top:4px;z-index:10;min-width:100px;overflow:hidden;}
.lang-menu.open{display:block;}
.lang-opt{display:block;width:100%;padding:8px 16px;border:none;background:#fff;font-size:13px;cursor:pointer;text-align:left;transition:background.15s;}
.lang-opt:hover{background:#f0f0f0;}
.lang-opt.on{background:var(--gold);color:#fff;font-weight:600;}

/* Hero */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#2a3a52 100%);color:#fff;padding:48px 20px;text-align:center;}
.hero.icon{font-size:48px;margin-bottom:12px;}
.hero h1{font-size:26px;font-weight:700;margin-bottom:8px;}
.hero.sub{font-size:15px;color:rgba(255,255,255,.7);max-width:600px;margin:0 auto;line-height:1.6;}

/* 统计条 */
.stats-bar{display:flex;gap:12px;padding:20px;max-width:960px;margin:0 auto;flex-wrap:wrap;}
.stat-card{background:var(--card);border-radius:10px;padding:16px;flex:1;min-width:120px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.stat-card.num{font-size:24px;font-weight:700;color:var(--navy);}
.stat-card.unit{font-size:12px;color:var(--muted);margin-top:2px;}

/* 区域标题 */
.section{max-width:960px;margin:0 auto;padding:0 20px;}
.section-head{display:flex;align-items:center;gap:10px;margin:32px 0 16px;}
.section-head.icon{font-size:24px;}
.section-head h2{font-size:18px;font-weight:700;color:var(--navy);}

/* 国家卡片网格 */
.country-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
@media(min-width:640px){.country-grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:960px){.country-grid{grid-template-columns:repeat(4,1fr);}}

.country-card{background:var(--card);border-radius:12px;padding:18px;cursor:pointer;transition:all.2s;box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px solid transparent;}
.country-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.12);border-color:var(--gold);transform:translateY(-2px);}
.country-card.flag{font-size:32px;margin-bottom:8px;}
.country-card.name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.country-card.name-en{font-size:11px;color:var(--muted);}
.country-card.tag{display:inline-block;background:var(--bg);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:4px;margin-top:6px;}

/* 区域卡片（宽版） */
.region-grid{display:grid;grid-template-columns:repeat(1,1fr);gap:14px;margin-bottom:24px;}
@media(min-width:640px){.region-grid{grid-template-columns:repeat(2,1fr);}}

.region-card{background:linear-gradient(135deg,var(--navy) 0%,#2a3a52 100%);color:#fff;border-radius:12px;padding:20px;cursor:pointer;transition:all.2s;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.region-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2);}
.region-card.icon{font-size:28px;margin-bottom:6px;}
.region-card.name{font-size:16px;font-weight:700;margin-bottom:4px;}
.region-card.desc{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5;}

/* 详情弹窗 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.detail{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.detail.top{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.detail.top.flag{font-size:40px;}
.detail.top h2{font-size:20px;font-weight:700;color:var(--navy);}
.detail.top.en{font-size:12px;color:var(--muted);}
.detail.block{margin-bottom:18px;}
.detail.block.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.detail.block.val{font-size:14px;line-height:1.7;color:var(--text);}
.detail.block.val strong{color:var(--navy);}
.detail.close-btn{display:block;margin:16px auto 0;padding:8px 24px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer;font-size:13px;transition:all.2s;}
.detail.close-btn:hover{border-color:var(--gold);color:var(--gold);}
footer{background:var(--navy);color:#7f8ea6;text-align:center;padding:24px 16px;font-size:12px;margin-top:30px;direction:ltr;}
footer.co{color:#cfd8e6;font-weight:700;font-size:13px;margin-bottom:4px;}
</style>
</head>

var COUNTRIES=[
 {id:'iraq',flag:'',name:{zh:'伊拉克',en:'Iraq',fr:'Irak',ar:'العراق'},tag:'中东',
 pop:'4700万',gdp:'2540亿美元',
 overview:{zh:'伊拉克是中东地区石油大国，已探明石油储量1450亿桶（世界第五）。石油产业占GDP约60%、财政收入的90%和外汇收入的96%。战后重建持续推进，基础设施、电力、交通是优先发展领域。人口年轻化明显，城镇化率约72%，消费市场高度依赖进口。',en:'Iraq is a major oil-rich Middle Eastern country with proven reserves of 145 billion barrels (5th globally). The oil sector accounts for ~60% of GDP, 90% of fiscal revenue, and 96% of foreign exchange. Post-war reconstruction continues, with infrastructure, power, and transport as priority sectors. The population is young with ~72% urbanization, and the consumer market is highly import-dependent.',fr:'L\'Irak est un grand pays pétrolier du Moyen-Orient avec des réserves prouvées de 145 milliards de barils (5ème mondial). Le secteur pétrolier représente ~60% du PIB, 90% des recettes fiscales et 96% des recettes en devises. La reconstruction post-guerre se poursuit, avec les infrastructures, l\'énergie et les transports comme secteurs prioritaires.',ar:'العراق دولة نفطية كبرى في الشرق الأوسط باحتياطيات مؤكدة تبلغ 145 مليار برميل (الخامسة عالمياً). قطاع النفط يمثل ~60% من الناتج المحلي و90% من الإيرادات الحكومية و96% من عائدات النقد الأجنبي. إعادة الإعمار بعد الحرب مستمرة مع أولوية للبنية التحتية والطاقة والنقل.'},
 trade:{zh:'2024年中伊双边贸易总额542.23亿美元，同比增长9%。中方出口159.86亿美元（+11.9%），进口382.37亿美元（+7.8%）。中国是伊拉克最大原油买家，进口石油6383.56万吨。中资公司新签承包工程合同额92.68亿美元（+75.2%）。中国主要出口：机械设备（31.8亿）、电子产品（22.3亿）、车辆（10.2亿）、塑料制品（7.9亿）、家具（7.7亿）、服装（针织5.8亿+非针织4.7亿）、皮革箱包（1.2亿）。',en:'In 2024, China-Iraq bilateral trade reached $54.2 billion (+9% YoY). China exported $15.99 billion (+11.9%) and imported $38.24 billion (+7.8%). China is Iraq\'s largest crude oil buyer, importing 63.8 million tons. Top Chinese exports: machinery ($3.18B), electrical equipment ($2.23B), vehicles ($1.02B), plastics ($789M), furniture ($774M), clothing ($1.06B combined), leather/bags ($121M).'},
 products:{zh:'重点机会品类：1)机械设备与电力设备（战后重建刚需）；2)家用电器与智能家居（消费升级）；3)汽车及零配件（公共交通薄弱，私家车需求旺盛，中国电动车品牌受青睐）；4)建材与家具（基建和住房需求）；5)服装与箱包（成衣进口增长24%，皮革箱包1.2亿美元）；6)塑料制品与橡胶制品；7)通信设备与电子产品。伊拉克市场特点是购买力有限但刚需强烈，价格敏感度高，中国产品性价比优势明显。',en:'Key opportunity categories: 1) Machinery & power equipment (reconstruction demand); 2) Home appliances & smart home (consumption upgrade); 3) Vehicles & parts (weak public transport, strong private car demand, Chinese EV brands gaining favor); 4) Building materials & furniture (infrastructure and housing); 5) Clothing & bags (ready-made clothing imports +24%, leather goods $121M); 6) Plastics & rubber products; 7) Telecom equipment & electronics. Market characteristics: limited purchasing power but strong basic demand, high price sensitivity, Chinese products have clear cost-performance advantage.'},
 prospect:{zh:'2025年GDP约2540亿美元，增长率约0.5-2.2%。伊政府大力推进2023-2025财年预算执行，在电力、铁路、公路、水处理等领域大规模上马基建项目。中国企业深度参与能源、电力、交通基础设施建设。中伊2015年建立战略伙伴关系，2024年双边贸易突破540亿美元。\'一带一路\'框架下合作持续深化，中国电动汽车、智能家居产品在伊拉克日益受到青睐。风险因素：安全形势仍复杂、法律体系不健全、营商环境排名靠后。',en:'2025 GDP ~$254B, growth ~0.5-2.2%. The government is implementing the 2023-2025 fiscal budget with large-scale infrastructure projects in power, rail, roads, and water treatment. Chinese companies are deeply involved in energy, power, and transport infrastructure. China-Iraq established a strategic partnership in 2015, with bilateral trade exceeding $54B in 2024. Under the BRI framework, cooperation continues to deepen. Chinese EVs and smart home products are increasingly popular. Risk factors: complex security situation, incomplete legal system, low business environment ranking.'}},

 {id:'sri_lanka',flag:'',name:{zh:'斯里兰卡',en:'Sri Lanka',fr:'Sri Lanka',ar:'سريلانكا'},tag:'南亚',
 pop:'2200万',gdp:'990亿美元',
 overview:{zh:'斯里兰卡是南亚岛国，以种植园经济为主，主要作物有茶叶、橡胶、椰子。2022年遭遇独立以来最严重经济危机，2024-2025年实现5%的经济增长，宏观经济逐步回暖。纺织服装业是重要出口产业，旅游业恢复至205万人次（2024年）。2025年名义GDP首次突破1000亿美元，人均GDP达5003美元。实行自由外贸政策，商品进口限制较少。',en:'Sri Lanka is a South Asian island nation with a plantation economy focused on tea, rubber, and coconuts. After its worst economic crisis in 2022, it achieved 5% growth in both 2024 and 2025. The textile and garment industry is a key export sector, tourism recovered to 2.05 million visitors in 2024. Nominal GDP exceeded $100B for the first time in 2025, with per capita GDP at $5,003. It maintains a liberal trade policy with few import restrictions.',fr:'Le Sri Lanka est une nation insulaire de l\'Asie du Sud avec une économie de plantation axée sur le thé, le caoutchouc et les noix de coco. Après sa pire crise économique en 2022, le pays a atteint 5% de croissance en 2024 et 2025. L\'industrie textile est un secteur d\'exportation clé, le tourisme a récupéré à 2,05 millions de visiteurs en 2024.',ar:'سريلانكا دولة جزرية في جنوب آسيا ذات اقتصاد مزارع يركز على الشاي والمطاط وجوز الهند. بعد أسوأ أزمة اقتصادية في 2022، حققت نمو 5% في 2024 و2025. صناعة النسيج قطاع تصدير رئيسي، وتعافى السياحة إلى 2.05 مليون زائر في 2024.'},
 trade:{zh:'2024年中斯双边贸易额54.6亿美元，同比增长30.4%。2025年上半年贸易额29亿美元（+10.4%）。2024年中国从斯进口约3.92亿美元，出口约4.97亿美元。中国主要出口：纺织品、机电产品、建材、小五金、医药等。中国从斯主要进口：橡胶及其制品、红茶、椰油等农产品和宝石。2025年斯里兰卡从中国进口约5.73亿美元。',en:'In 2024, China-Sri Lanka bilateral trade reached $5.46B (+30.4% YoY). H1 2025 trade was $2.9B (+10.4%). China mainly exports: textiles, electromechanical products, building materials, hardware, pharmaceuticals. China mainly imports from Sri Lanka: rubber products, black tea, coconut oil and other agricultural products, gems. In 2025, Sri Lanka\'s imports from China reached ~$5.73B.'},
 products:{zh:'重点机会品类：1)纺织品与面辅料（斯里兰卡服装出口产业需要大量进口面料）；2)机电产品与电子设备；3)建材与五金（灾后重建和基础设施建设）；4)医药产品；5)太阳能设备与新能源产品；6)消费品（家电、日用品等，经济恢复后消费需求回升）。斯市场经济回暖，进口限制逐步取消，消费复苏态势明显。',en:'Key opportunity categories: 1) Textiles & fabrics (Sri Lanka\'s garment export industry needs large fabric imports); 2) Electromechanical products & electronics; 3) Building materials & hardware (post-disaster reconstruction and infrastructure); 4) Pharmaceutical products; 5) Solar equipment & new energy products; 6) Consumer goods (appliances, daily necessities, consumption recovery). The economy is recovering, import restrictions are being lifted, and consumer recovery is evident.'},

 {id:'serbia',flag:'',name:{zh:'塞尔维亚',en:'Serbia',fr:'Serbie',ar:'صربيا'},tag:'欧洲',
 pop:'660万（不含科索沃）',gdp:'839.7亿欧元（约960亿美元）',
 overview:{zh:'塞尔维亚位于巴尔干半岛，是西欧、中东和地中海通往欧洲市场的便捷通道。经济以冶金、汽车制造、纺织、农牧业和服务业为主。2024年GDP增长3.9%，2025年受外部逆风影响放缓至约2%。积极推进EU入盟进程，外国直接投资持续增长（2022年达43亿欧元）。2024年7月中塞自贸协定生效，双边贸易快速增长。浙江企业在塞建成欧洲首座人形机器人量产基地。',en:'Serbia is located in the Balkans, serving as a convenient gateway to European markets from Western Europe, the Middle East and the Mediterranean. The economy focuses on metallurgy, automotive, textiles, agriculture and services. GDP grew 3.9% in 2024, slowing to ~2% in 2025 due to external headwinds. It is actively pursuing EU accession with sustained FDI inflows (€4.3B in 2022). The China-Serbia FTA took effect in July 2024, boosting bilateral trade rapidly. A Zhejiang enterprise built Europe\'s first humanoid robot mass production base in Serbia.',fr:'La Serbie est située dans les Balkans, servant de porte d\'entrée vers les marchés européens. L\'économie se concentre sur la métallurgie, l\'automobile, les textiles, l\'agriculture et les services. Le PIB a augmenté de 3,9% en 2024, ralentissant à ~2% en 2025. L\'accord de libre-échange Chine-Serbie est entré en vigueur en juillet 2024.',ar:'تقع صربيا في البلقان، وتعتبر بوابة مريحة للأسواق الأوروبية. يركز الاقتصاد على التعدين وصناعة السيارات والنسيج والزراعة والخدمات. نما الناتج المحلي 3.9% في 2024، وتباطأ إلى ~2% في 2025. دخلت اتفاقية التجارة الحرة بين الصين وصربيا حيز التنفيذ في يوليو 2024.'},
 trade:{zh:'2024年中国对塞出口34.5亿美元（+27.7%），双边贸易快速增长。2025年我对塞进出口467.3亿元人民币（+14.4%）。2026年前4个月对塞进出口186.5亿元（+35.8%），其中出口106.8亿元（+14.7%），进口79.7亿元（+80%）。中国主要出口：机电产品（79.3亿元，占74.3%）、家用电器、\'新三样\'（锂电池、电动汽车等增长6.7倍）。中塞自贸协定生效以来贸易规模明显扩大。中国自塞主要进口铜矿砂、黄金矿砂等金属矿砂（占81.9%）。',en:'In 2024, China\'s exports to Serbia reached $3.45B (+27.7%). In 2025, bilateral trade reached ¥46.73B (+14.4%). In the first 4 months of 2026, trade reached ¥18.65B (+35.8%). Main Chinese exports: electromechanical products (¥7.93B, 74.3% share), household appliances, \'new three items\' (lithium batteries, EVs growing 6.7x). The China-Serbia FTA has significantly expanded trade. China mainly imports copper ore, gold ore and other metal ores from Serbia (81.9% share).'},
 products:{zh:'重点机会品类：1)机电产品与电子设备（最大出口品类）；2)家用电器（增长9.4%）；3)电动汽车与锂电池（\'新三样\'爆发式增长6.7倍）；4)钢铁制品与建材；5)塑料制品与橡胶制品；6)车辆及零配件；7)光学的医疗器械。中塞自贸协定大幅降低关税壁垒，为消费品出口创造有利条件。塞尔维亚作为欧洲制造基地的区位优势突出。',en:'Key opportunity categories: 1) Electromechanical & electronic equipment (largest export category); 2) Household appliances (+9.4%); 3) Electric vehicles & lithium batteries (\'new three\' growing 6.7x); 4) Steel products & building materials; 5) Plastics & rubber; 6) Vehicles & parts; 7) Optical/medical instruments. The China-Serbia FTA significantly reduces tariff barriers, creating favorable conditions for consumer goods exports. Serbia\'s advantage as a European manufacturing base is prominent.'},
 prospect:{zh:'IMF预测2026年GDP增长2.8%，2027年4.0-4.6%。中塞自贸协定红利持续释放，2026年前4个月贸易增速35.8%。EU入盟进程推进带来改革红利和基建投资。中国企业在塞深耕电力、制造、基础设施等领域，\'中国制造\'向绿色、智能方向升级。本币互换协议扩大至50亿元。风险：NIS石油公司制裁问题、能源安全挑战、国内抗议活动。',en:'IMF projects 2026 GDP growth at 2.8%, 2027 at 4.0-4.6%. The China-Serbia FTA dividends continue, with trade growth of 35.8% in early 2026. EU accession progress brings reform dividends and infrastructure investment. Chinese companies are deeply engaged in power, manufacturing, and infrastructure in Serbia, with \'Made in China\' upgrading toward green and smart directions. Currency swap agreement expanded to ¥5B. Risks: NIS oil company sanctions, energy security challenges, domestic protests.'}},

 {id:'morocco',flag:'',name:{zh:'摩洛哥',en:'Morocco',fr:'Maroc',ar:'المغرب'},tag:'北非',
 pop:'3680万',gdp:'1600亿美元（2024年）',
 overview:{zh:'摩洛哥是非洲第五大经济体，非洲第一个拥有高铁的国家。经济支柱包括磷酸盐工业（世界第一大出口国）、汽车制造、纺织服装、旅游和农业。2025年GDP增长4.9%，2024年增长3.8%。2030年FIFA世界杯主办国之一，推动大规模基建投资。丹吉尔科技城已吸引34家中企入驻，总投资约35亿美元。中国2026年对非洲53国实施零关税，中摩经贸合作加速。',en:'Morocco is Africa\'s 5th largest economy and the first African country with high-speed rail. Economic pillars include phosphate industry (world\'s largest exporter), automotive, textiles, tourism, and agriculture. GDP grew 4.9% in 2025, 3.8% in 2024. Co-host of the 2030 FIFA World Cup, driving massive infrastructure investment. The Tangier Tech City has attracted 34 Chinese companies with ~$3.5B total investment. China\'s zero-tariff policy for 53 African countries in 2026 is accelerating China-Morocco trade.',fr:'Le Maroc est la 5ème économie d\'Afrique et le premier pays africain avec un train à grande vitesse. Les piliers économiques incluent l\'industrie des phosphates (premier exportateur mondial), l\'automobile, les textiles, le tourisme et l\'agriculture. Le PIB a augmenté de 4,9% en 2025. Co-hôte de la Coupe du Monde FIFA 2030, stimulant des investissements massifs dans les infrastructures.',ar:'المغرب خامس أكبر اقتصاد في أفريقيا وأول دولة أفريقية تمتلك قطاراً فائق السرعة. تشمل الركائز الاقتصادية صناعة الفوسفات (أكبر مصدر عالمي) والسيارات والنسيج والسياحة والزراعة. نما الناتج المحلي 4.9% في 2025. مستضيف مشترك لكأس العالم 2030 مما يدفع استثمارات ضخمة في البنية التحتية.'},
 trade:{zh:'2025年中摩双边贸易总额109.6亿美元。中方出口98.8亿美元，进口10.8亿美元。中国连续多年保持摩洛哥全球第三大、亚洲第一大贸易伙伴。2024年摩洛哥从中国进口约77.4亿美元（+19.8%），2025年增至98.8亿美元（+27.6%）。中国主要出口：纺织服装、电子产品、机械设备、鞋类、五金等。摩洛哥进口以汽车零部件、工业机械、电子元件、纺织品原料为主，服务于其面向欧洲的制造业出口。',en:'In 2025, China-Morocco bilateral trade reached $10.96B. China exported $9.88B, imported $1.08B. China has been Morocco\'s 3rd largest global and 1st Asian trade partner for years. Morocco\'s imports from China reached ~$7.74B in 2024 (+19.8%), rising to $9.88B in 2025 (+27.6%). China mainly exports: textiles, electronics, machinery, footwear, hardware. Morocco imports automotive parts, industrial machinery, electronic components, textile materials for its Europe-oriented manufacturing exports.'},
 products:{zh:'重点机会品类：1)汽车零部件与线束（摩洛哥汽车产业配套需求旺盛，服务于欧洲市场）；2)工业机械与设备；3)电子元件与电气组件；4)纺织服装原料与面辅料（摩洛哥服装制造业需求）；5)建材与钢结构（2030世界杯场馆和高铁建设）；6)新能源设备（锂电材料、太阳能等）；7)消费品（家电、鞋类等）。摩洛哥定位为\'非洲-欧洲-亚洲\'制造桥梁，中国中间品出口潜力巨大。',en:'Key opportunity categories: 1) Automotive parts & wiring harnesses (strong demand from Morocco\'s auto industry serving European market); 2) Industrial machinery & equipment; 3) Electronic components & electrical equipment; 4) Textile raw materials & fabrics (Morocco\'s garment manufacturing); 5) Building materials & steel structures (2030 World Cup venues and HSR construction); 6) New energy equipment (lithium materials, solar); 7) Consumer goods (appliances, footwear). Morocco positions itself as an \'Africa-Europe-Asia\' manufacturing bridge, with huge potential for Chinese intermediate goods exports.'},
 prospect:{zh:'IMF预测2026年GDP增长4.4%，2027年4.5%。2030年世界杯筹备推动大规模基建投资。高铁二期项目启动，中企参与建设。零关税政策落地推动中摩贸易快速增长。丹吉尔科技城持续吸引中国产能。中国海关与摩洛哥海关签署AEO互认。风险：中东冲突影响大宗商品价格和全球需求、失业率较高（13%）、对欧洲经济依赖度高。',en:'IMF projects 2026 GDP growth at 4.4%, 2027 at 4.5%. The 2030 World Cup preparation drives massive infrastructure investment. The second-phase HSR project has started with Chinese companies participating. Zero-tariff policy promotes rapid trade growth. Tangier Tech City continues to attract Chinese manufacturing capacity. China Customs signed AEO mutual recognition with Morocco. Risks: Middle East conflict affecting commodity prices and global demand, high unemployment (13%), high dependence on European economy.'}},

 {id:'mauritania',flag:'',name:{zh:'毛里塔尼亚',en:'Mauritania',fr:'Mauritanie',ar:'موريتانيا'},tag:'西非',
 pop:'531万',gdp:'120亿美元',
 overview:{zh:'毛里塔尼亚是联合国公布的世界最不发达国家之一，经济结构单一，矿业（铁矿）和渔业是两大支柱产业。2024年底大型天然气田（GTA）投产，经济有望改善。粮食自给率仅35%，所需生活资料的80%及大部分生产资料靠进口。中国是其最大贸易伙伴，铁矿砂主要出口中国。2024年9月建立战略伙伴关系，中国给予100%税目产品零关税待遇。',en:'Mauritania is one of the UN\'s least developed countries, with a simple economic structure. Mining (iron ore) and fishing are the two pillar industries. The large GTA gas field commenced production in late 2024, promising economic improvement. Food self-sufficiency is only 35%; 80% of daily necessities and most production materials are imported. China is its largest trading partner, with iron ore mainly exported to China. A strategic partnership was established in September 2024, with China granting 100% tariff-free access.',fr:'La Mauritanie est l\'un des pays les moins avancés selon l\'ONU, avec une structure économique simple. Les mines (minerai de fer) et la pêche sont les deux industries piliers. Le grand champ gazier GTA a commencé sa production fin 2024. La Chine est son premier partenaire commercial. Un partenariat stratégique a été établi en septembre 2024, avec un accès en franchise de droits de 100%.',ar:'موريتانيا من أقل الدول نمواً وفق الأمم المتحدة، ذات هيكل اقتصادي بسيط. التعدين (خام الحديد) والصيد هما الركيزتان. بدأ حقل الغاز الكبير GTA الإنتاج في أواخر 2024. الصين أكبر شريك تجاري، وخام الحديد يصدر أساساً إليها. أقيم شراكة استراتيجية في سبتمبر 2024 مع إعفاء جمركي 100%.'},
 trade:{zh:'2025年中毛双边贸易总额25.5亿美元，其中中方出口12.6亿美元，进口12.9亿美元。中国主要出口：茶叶、轻纺产品、建材、五金、农机、家电等。主要进口：铁矿砂和渔产品。中国是毛里塔尼亚最大贸易伙伴，铁矿砂主要出口中国。2024年中国给予毛100%税目产品零关税待遇。毛进口中22.1%为机械设备，16.8%为石油产品，15.8%为粮食。',en:'In 2025, China-Mauritania bilateral trade reached $2.55B, with China exporting $1.26B and importing $1.29B. China mainly exports: tea, textiles, building materials, hardware, agricultural machinery, appliances. Main imports: iron ore and fishery products. China is Mauritania\'s largest trading partner. In 2024, China granted 100% tariff-free access to Mauritanian products. Mauritania\'s imports are 22.1% machinery, 16.8% petroleum products, 15.8% food grains.'},
 products:{zh:'重点机会品类：1)食品与日用品（粮食自给率仅35%，80%生活资料靠进口）；2)建材与五金（基础设施建设需求）；3)机械设备与农机；4)家电与日用品；5)轻纺产品与服装；6)太阳能设备（偏远地区供电需求）。市场规模有限但刚需强烈，零关税政策有利于扩大双边贸易。天然气产业兴起将带动相关设备需求。',en:'Key opportunity categories: 1) Food & daily necessities (only 35% food self-sufficiency, 80% of necessities imported); 2) Building materials & hardware (infrastructure demand); 3) Machinery & agricultural equipment; 4) Home appliances & daily necessities; 5) Textiles & clothing; 6) Solar equipment (remote area power needs). Market is limited in size but with strong basic demand. Zero-tariff policy facilitates expanded bilateral trade. Emerging gas industry will drive related equipment demand.'},
 prospect:{zh:'IMF/非洲开发银行预测2026年GDP增长4.4%，2027年4.7%。GTA天然气项目投产后年产液化天然气230-250万吨，远期可达1000万吨/年，有望改善财政和经济结构。绿氢开发潜力巨大。政府推动\'经济腾飞计划\'，改善基础设施和营商环境。中国给予零关税待遇，双边贸易有望扩大。风险：全球经济不确定性、铁矿石价格波动、萨赫勒地区安全形势、气候变化影响。',en:'IMF/AfDB projects 2026 GDP growth at 4.4%, 2027 at 4.7%. The GTA gas project will produce 2.3-2.5 million tons of LNG annually, potentially reaching 10 million tons/year, expected to improve fiscal and economic structure. Green hydrogen potential is significant. The government\'s \'Economic Takeoff Plan\' aims to improve infrastructure and business environment. China\'s zero-tariff treatment is expected to expand bilateral trade. Risks: global economic uncertainty, iron ore price volatility, Sahel security situation, climate change impacts.'}},

 {id:'cuba',flag:'',name:{zh:'古巴',en:'Cuba',fr:'Cuba',ar:'كوبا'},tag:'加勒比',
 pop:'975万',gdp:'约890亿美元（按2018年不变价）',
 overview:{zh:'古巴是加勒比海最大岛国，实行社会主义计划经济。制糖业、旅游和镍出口是传统经济支柱。2020年以来经济累计下降超过15%，2025年GDP收缩约5%，主要原因是持续能源危机。电力供应严重不足，通胀高企（官方14%，实际食品价格涨幅70%）。2026年6月批准176项改革举措，加大私营经济开放力度。中国是古巴第一大货物贸易伙伴。',en:'Cuba is the largest island nation in the Caribbean, practicing socialist planned economy. Sugar, tourism and nickel exports are traditional pillars. Since 2020, the economy has contracted over 15%, with 2025 GDP shrinking ~5% due to a persistent energy crisis. Severe power shortages, high inflation (official 14%, food prices up 70%). In June 2026, 176 reform measures were approved, increasing private sector openness. China is Cuba\'s largest goods trading partner.',fr:'Cuba est la plus grande nation insulaire des Caraïbes, pratiquant une économie planifiée socialiste. Le sucre, le tourisme et les exportations de nickel sont les piliers traditionnels. Depuis 2020, l\'économie s\'est contractée de plus de 15%, le PIB de 2025 ayant diminué d\'environ 5% en raison d\'une crise énergétique persistante.',ar:'كوبا أكبر دولة جزرية في البحر الكاريبي، تمارس اقتصاداً اشتراكياً مخططاً. السكر والسياحة وتصدير النيكل هي الركائز التقليدية. منذ 2020، انكمش الاقتصاد بأكثر من 15%، مع انكماش الناتج المحلي ~5% في 2025 بسبب أزمة طاقة مستمرة.'},
 trade:{zh:'2025年中古贸易额13.11亿美元，同比增长43.3%。中方出口10.83亿美元（+8.55%），进口2.28亿美元（-15.6%）。中国主要出口：半导体器件、机电产品、变压器和变流器、蓄电池等。主要进口：锌、镍、贵金属矿砂及精矿、烟草等。中国是古巴第一大货物贸易伙伴，古巴是中国在加勒比地区第五大贸易伙伴。2025年中国援古巴太阳能光伏和家用太阳能设备项目推进。',en:'In 2025, China-Cuba trade reached $1.31B (+43.3%). China exported $1.08B (+8.55%) and imported $228M (-15.6%). China mainly exports: semiconductors, electromechanical products, transformers, batteries. Main imports: zinc, nickel, precious metal ores, tobacco. China is Cuba\'s largest goods trading partner, Cuba is China\'s 5th largest trade partner in the Caribbean. China\'s solar PV and household solar equipment aid projects to Cuba progressed in 2025.'},
 products:{zh:'重点机会品类：1)太阳能设备与新能源（古巴能源危机严重，中国援建太阳能电站项目）；2)家电与消费电子（日用品严重依赖进口）；3)食品与农产品加工（粮食供应不足）；4)医药产品（古巴医药产业有基础但原料需要进口）；5)交通工具及零配件（中国援古巴公交车零配件项目）；6)日用消费品。市场特殊性：美国禁运导致供应短缺，中国产品质量好价格适中，但支付能力受限。',en:'Key opportunity categories: 1) Solar equipment & new energy (severe energy crisis, China building solar stations); 2) Home appliances & consumer electronics (heavy import dependence); 3) Food & agricultural processing (food supply shortage); 4) Pharmaceutical products (Cuba has pharma base but needs raw materials); 5) Transport vehicles & parts (China\'s bus parts aid project); 6) Daily consumer goods. Market specifics: US embargo causes supply shortages, Chinese products are good quality and reasonably priced, but payment capacity is limited.'},
 prospect:{zh:'CEPAL预测2026年古巴GDP下降10.3%，为拉美地区最差。能源危机短期难以解决，但176项改革举措显示开放意愿。中国持续提供援助（粮食、太阳能设备、公交车配件等）。中古关系密切，2025年9月发表加快构建中古命运共同体联合声明。中长期看，如果改革推进，新能源、电信、生物医药等领域有合作潜力。风险：经济持续衰退、外汇短缺、美国制裁、支付风险极高。',en:'CEPAL projects 2026 Cuban GDP to decline 10.3%, the worst in Latin America. The energy crisis is hard to resolve short-term, but 176 reform measures show openness willingness. China continues aid (food, solar equipment, bus parts). China-Cuba relations are close, with a September 2025 joint statement on building a community of shared future. Medium to long term, if reforms progress, there\'s potential in new energy, telecom, biotech. Risks: continued economic decline, forex shortages, US sanctions, extremely high payment risk.'}},

 {id:'algeria',flag:'',name:{zh:'阿尔及利亚',en:'Algeria',fr:'Algérie',ar:'الجزائر'},tag:'北非',
 pop:'4743万',gdp:'2880亿美元',
 overview:{zh:'阿尔及利亚是非洲面积最大的国家，经济规模在非洲位居前列。石油与天然气产业是国民经济支柱，产值占GDP约30%，税收占财政60%，出口占90%以上。粮食与日用品主要依赖进口，是世界十大粮食进口国之一。2025年GDP增长3.4%。中国长期是阿尔及利亚第一大贸易伙伴。阿尔及利亚是中国最大的海外承包市场之一。',en:'Algeria is Africa\'s largest country by area, with an economy ranking among the top in Africa. Oil and gas are the economic pillars, accounting for ~30% of GDP, 60% of fiscal revenue, and over 90% of exports. Food and daily necessities are heavily import-dependent; it is one of the world\'s top 10 food importers. GDP grew 3.4% in 2025. China has long been Algeria\'s largest trading partner. Algeria is one of China\'s largest overseas contracting markets.',fr:'L\'Algérie est le plus grand pays d\'Afrique par sa superficie, avec une économie classée parmi les premières du continent. Le pétrole et le gaz sont les piliers économiques, représentant ~30% du PIB, 60% des recettes fiscales et plus de 90% des exportations. Les denrées alimentaires et les produits de base dépendent fortement des importations.',ar:'الجزائر أكبر دولة في أفريقيا مساحة، وذات اقتصاد من الأكبر في القارة. النفط والغاز هما ركيزتا الاقتصاد، يمثلان ~30% من الناتج و60% من الإيرادات وأكثر من 90% من الصادرات. الغذاء والسلع تعتمد بشدة على الاستيراد، وهي من أكبر 10 دول مستوردة للغذاء عالمياً.'},
 trade:{zh:'2025年中阿贸易总额152.5亿美元，其中中方出口139.1亿美元，进口13.4亿美元。2024年阿尔及利亚对外贸易总额965亿美元（进口473亿，出口492亿）。中国主要出口：机电产品、钢铁制品、车辆及零部件等。主要进口：石油化工原料。中国长期是阿尔及利亚第一大贸易伙伴。',en:'In 2025, China-Algeria trade reached $15.25B, with China exporting $13.91B and importing $1.34B. In 2024, Algeria\'s total foreign trade was $96.5B (imports $47.3B, exports $49.2B). China mainly exports: electromechanical products, steel products, vehicles and parts. Main imports: petrochemical raw materials. China has long been Algeria\'s largest trading partner.'},
 products:{zh:'重点机会品类：1)机电产品与工业设备（油气产业和工业发展需求）；2)钢铁制品与建材（基建和住房需求）；3)车辆及零配件（交通运输需求）；4)家电与消费电子（4700万人口的大众消费市场）；5)食品与日用品（粮食依赖进口）；6)太阳能设备（南部沙漠地区能源需求）；7)通信设备与IT产品。市场特点：人口规模大，消费品高度依赖进口，但进口管制较严格，部分商品有进口许可制度。',en:'Key opportunity categories: 1) Electromechanical & industrial equipment (oil/gas industry and industrial demand); 2) Steel products & building materials (infrastructure and housing); 3) Vehicles & parts (transportation needs); 4) Home appliances & consumer electronics (mass consumer market of 47M people); 5) Food & daily necessities (food import dependent); 6) Solar equipment (southern desert energy needs); 7) Telecom & IT products. Market characteristics: large population, high import dependence for consumer goods, but strict import controls with licensing systems for some products.'},
 prospect:{zh:'2025年GDP增长3.4%，人均6100美元。政府推动经济多元化，减少对油气依赖。中国是最大贸易伙伴和最大海外承包市场之一。2014年建立全面战略伙伴关系。阿尔及利亚2024年总统连任后推进改革。风险：经济对油气依赖度极高（出口90%+）、进口管制严格、官僚效率较低、营商环境有待改善。',en:'2025 GDP growth 3.4%, per capita $6,100. The government is promoting economic diversification to reduce oil/gas dependence. China is the largest trading partner and one of the largest overseas contracting markets. A comprehensive strategic partnership was established in 2014. Post-2024 presidential re-election, reforms are advancing. Risks: extreme oil/gas dependence (90%+ of exports), strict import controls, bureaucratic inefficiency, business environment needs improvement.'}}
];

var REGIONS=[
 {id:'belt_and_road',icon:'',name:{zh:'一带一路国家',en:'Belt and Road Initiative (BRI) Countries',fr:'Pays de l\'Initiative la Ceinture et la Route',ar:'دول مبادرة الحزام والطريق'},
 desc:{zh:'共建\'一带一路\'国家是中国最大的贸易伙伴群体。2025年中国对共建国家进出口23.6万亿元（+6.3%），占进出口总值的51.9%，占比连续两年超过50%。出口13.69万亿元（+11.2%），进口9.92万亿元（+0.1%）。中国以对外承包工程方式对共建国家出口1264.9亿元（+45.7%）。农产品贸易达1.43万亿元创历史新高。高技术产品和绿色产品出口增长强劲。',en:'BRI partner countries are China\'s largest trading group. In 2025, China\'s trade with BRI countries reached ¥23.6 trillion (+6.3%), accounting for 51.9% of total trade, exceeding 50% for the second consecutive year. Exports were ¥13.69 trillion (+11.2%), imports ¥9.92 trillion (+0.1%). Trade via overseas contracting projects reached ¥126.49B (+45.7%). Agricultural trade hit a record ¥1.43 trillion. High-tech and green product exports grew strongly.',fr:'Les pays partenaires de l\'Initiative la Ceinture et la Route constituent le plus grand groupe commercial de la Chine. En 2025, le commerce avec ces pays a atteint 23 600 milliards de yuans (+6,3%), soit 51,9% du commerce total.',ar:'دول مبادرة الحزام والطريق هي أكبر مجموعة تجارية للصين. في 2025، بلغت التجارة مع هذه الدول 23.6 تريليون يوان (+6.3%)، تمثل 51.9% من إجمالي التجارة.'},
 trade:{zh:'一带一路国家覆盖东南亚、南亚、中东、非洲、中东欧等区域，总人口约44亿，GDP总量约占全球40%。中国对共建国家出口增速（11.2%）远高于整体出口增速（6.1%）。东盟连续3年成为中国第一大出口市场。对中东、中亚、非洲等新兴市场出口增速均快于整体。中间品贸易是拉动出口的主要力量。',en:'BRI countries cover Southeast Asia, South Asia, the Middle East, Africa, Central and Eastern Europe, with a total population of ~4.4 billion and GDP accounting for ~40% of the global total. China\'s export growth to BRI countries (11.2%) far exceeds overall export growth (6.1%). ASEAN has been China\'s largest export market for 3 consecutive years. Export growth to the Middle East, Central Asia, and Africa all exceed the overall average. Intermediate goods trade is the main driver of exports.'},
 products:{zh:'一带一路国家消费品市场机会：1)消费电子与家电（智能化升级需求广泛）；2)纺织服装（人口基数大、年轻化程度高）；3)建材与家居（大规模基础设施建设带动）；4)汽车及零配件（公共交通和个人出行需求）；5)新能源产品（太阳能、风电等绿色转型需求）；6)医疗器械与药品（公共卫生需求）；7)农产品加工食品；8)箱包与日用品。\'硬联通\'基础设施改善降低物流成本，\'软联通\'贸易便利化提升市场准入。',en:'Consumer market opportunities in BRI countries: 1) Consumer electronics & appliances (widespread smart upgrade demand); 2) Textiles & clothing (large population base, high youth ratio); 3) Building materials & home furnishings (large-scale infrastructure); 4) Vehicles & parts (transport and mobility needs); 5) New energy products (solar, wind green transition); 6) Medical devices & pharmaceuticals (public health needs); 7) Processed food & agricultural products; 8) Bags & daily necessities. \'Hard connectivity\' infrastructure reduces logistics costs, \'soft connectivity\' trade facilitation improves market access.'},
 prospect:{zh:'一带一路已进入高质量发展新阶段，2025年占中国外贸比重超50%。绿色丝绸之路和数字丝绸之路是未来重点方向。风力发电机组出口增长73.9%，智能手表和智能玩具畅销170多个国家。中国已与共建国家签署100余份农食产品准入文件。对外承包工程完成营业额10902亿元（+9.6%）。未来随着丝路海运、跨境铁路和空中丝路深入发展，贸易便利化将进一步提升。',en:'The BRI has entered a new phase of high-quality development, accounting for over 50% of China\'s trade in 2025. The Green Silk Road and Digital Silk Road are future priorities. Wind turbine exports grew 73.9%, smart watches and toys sold to 170+ countries. China has signed 100+ agricultural food access documents with partner countries. Overseas contracting completed ¥109.02B (+9.6%). As Maritime Silk Road, cross-border railways and Air Silk Road develop further, trade facilitation will continue to improve.'}},

 {id:'arab_states',icon:'',name:{zh:'阿拉伯国家',en:'Arab States',fr:'États Arabes',ar:'الدول العربية'},
 desc:{zh:'阿拉伯国家联盟22个成员国覆盖西亚北非地区，总人口约4.5亿。2024年中阿双边贸易额达4074亿美元（+2.3%），其中中国出口2060亿美元，进口2014亿美元。中国连续多年保持阿拉伯国家最大贸易伙伴地位。阿联酋是中国在中东第一大出口市场和第二大贸易伙伴，2024年中阿（联酋）贸易额首次突破1000亿美元。主要出口品类：汽车、手机、工业制品、机械、电子产品。主要进口：原油、天然气、石化产品。',en:'The Arab League\'s 22 member states cover West Asia and North Africa with ~450 million people. In 2024, China-Arab trade reached $407.4B (+2.3%), with China exporting $206B and importing $201.4B. China has been the Arab states\' largest trading partner for years. UAE is China\'s largest export market and 2nd largest trade partner in the Middle East, with bilateral trade exceeding $100B in 2024. Main exports: vehicles, phones, industrial products, machinery, electronics. Main imports: crude oil, natural gas, petrochemicals.',fr:'Les 22 États membres de la Ligue arabe couvrent l\'Asie occidentale et l\'Afrique du Nord avec ~450 millions d\'habitants. En 2024, le commerce sino-arabe a atteint 407,4 milliards de dollars (+2,3%). La Chine est le premier partenaire commercial des États arabes depuis de nombreuses années.',ar:'تغطي الدول الـ22 الأعضاء في جامعة الدول العربية غرب آسيا وشمال أفريقيا بتعداد سكاني ~450 مليون. في 2024، بلغت التجارة الصينية-العربية 407.4 مليار دولار (+2.3%). الصين أكبر شريك تجاري للدول العربية لسنوات عديدة.'},
 trade:{zh:'阿拉伯国家是中国重要的能源供应地和新兴出口市场。中国出口的工业制品主要包括汽车（出口量快速增长）、智能手机、家电、机械设备、建材、纺织品等。消费品方面，电子产品、服装鞋帽、家居用品、厨房用品等需求旺盛。阿联酋电商市场规模2024年约88亿美元，服装鞋类和消费电子是前三大品类。中国对阿拉伯国家出口增长主要受益于基建投资、人口年轻化（中位年龄约25-30岁）和消费多样化。',en:'Arab states are important energy suppliers and emerging export markets for China. Main industrial exports include vehicles (rapidly growing), smartphones, appliances, machinery, building materials, textiles. Consumer goods demand is strong in electronics, clothing, home furnishings, and kitchenware. UAE\'s e-commerce market reached ~$8.8B in 2024, with apparel and consumer electronics as top categories. China\'s export growth benefits from infrastructure investment, young population (median age ~25-30), and consumption diversification.'},
 products:{zh:'重点机会品类：1)汽车及配件（中国汽车品牌在中东快速扩张，新能源车增长迅猛）；2)消费电子与智能手机；3)家电与智能家居；4)纺织服装与鞋类；5)建材与家居用品；6)食品饮料加工；7)太阳能与新能源设备；8)医疗器械与药品。阿拉伯市场消费能力强（海湾国家人均GDP超2万美元），对品质有较高要求，品牌意识强。',en:'Key opportunity categories: 1) Vehicles & parts (Chinese brands rapidly expanding in Middle East, NEV growth surging); 2) Consumer electronics & smartphones; 3) Home appliances & smart home; 4) Textiles, clothing & footwear; 5) Building materials & home furnishings; 6) Food & beverage processing; 7) Solar & new energy equipment; 8) Medical devices & pharmaceuticals. Arab market has strong purchasing power (Gulf countries per capita GDP >$20K), higher quality requirements, and strong brand awareness.'},
 prospect:{zh:'阿拉伯国家正积极推进经济多元化转型（沙特2030愿景、阿联酋多元化战略等），减少对石油依赖，大力发展制造业、旅游业和数字经济。中国企业在埃及投资轮胎制造（近60亿美元）、在阿联酋布局科技和物流。2026年中国对非洲53国零关税政策间接惠及北非阿拉伯国家。中东地区基建投资持续增长，为中国产品提供广阔市场。风险：地缘政治冲突、部分国家外汇管制、物流成本较高。',en:'Arab states are actively promoting economic diversification (Saudi Vision 2030, UAE diversification strategy), reducing oil dependence by developing manufacturing, tourism, and digital economy. Chinese companies invest in tire manufacturing in Egypt (~$6B) and technology/logistics in UAE. China\'s 2026 zero-tariff policy for 53 African countries indirectly benefits North African Arab states. Middle East infrastructure investment continues to grow, providing broad markets for Chinese products. Risks: geopolitical conflicts, some countries\' forex controls, high logistics costs.'}},

 {id:'asean',icon:'',name:{zh:'东盟/ASEAN',en:'ASEAN (Association of Southeast Asian Nations)',fr:'ASEAN (Association des nations de l\'Asie du du Sud-Est)',ar:'آسيان (رابطة دول جنوب شرق آسيا)'},
 desc:{zh:'东盟10国总人口约6.8亿，是世界第三大劳动力市场和第四大经济体量。东盟已连续3年成为中国第一大出口市场和第一大贸易伙伴。2025年中国与东盟贸易额7.55万亿元（+8%）。RCEP（区域全面经济伙伴关系协定）为双边贸易提供制度保障。2025年中国对RCEP其他成员国进出口13.85万亿元（+5.3%）。东盟制造业快速发展，电子、汽车、纺织等产业对中间品和资本品进口需求旺盛。',en:'ASEAN\'s 10 member states have ~680 million people, the world\'s 3rd largest labor force and 4th largest economic bloc. ASEAN has been China\'s largest export market and trading partner for 3 consecutive years. In 2025, China-ASEAN trade reached ¥7.55 trillion (+8%). RCEP provides institutional guarantees for bilateral trade. In 2025, China\'s trade with other RCEP members reached ¥13.85 trillion (+5.3%). ASEAN\'s rapidly developing manufacturing sector has strong demand for intermediate and capital goods in electronics, automotive, textiles.',fr:'Les 10 États membres de l\'ASEAN comptent ~680 millions d\'habitants, le 3ème plus grand marché du travail et le 4ème bloc économique mondial. L\'ASEAN est le premier partenaire commercial et premier marché d\'exportation de la Chine depuis 3 ans. En 2025, le commerce Chine-ASEAN a atteint 7 550 milliards de yuans (+8%).',ar:'تضم آسيان 10 دول بإجمالي سكان ~680 مليون، ثالث أكبر سوق عمل ورابع أكبر كتلة اقتصادية عالمياً. آسيان أكبر شريك تجاري وأكبر سوق تصدير للصين لـ3 سنوات متتالية. في 2025، بلغت التجارة بين الصين وآسيان 7.55 تريليون يوان (+8%).'},
 trade:{zh:'2025年中国与东盟贸易额7.55万亿元（+8%）。主要出口品类包括：机电产品、集成电路、自动数据处理设备、纺织品、塑料制品、钢铁制品等。东盟是中国中间品出口的重要目的地，也是\'新三样\'（电动汽车、锂电池、太阳能电池）的重要市场。中国从东盟主要进口集成电路、农产品、矿产资源等。跨境电商增长迅速，2025年中国跨境电商进出口2.75万亿元。',en:'In 2025, China-ASEAN trade reached ¥7.55 trillion (+8%). Main exports: electromechanical products, integrated circuits, data processing equipment, textiles, plastics, steel products. ASEAN is a key destination for China\'s intermediate goods exports and an important market for \'new three items\' (EVs, lithium batteries, solar cells). China mainly imports ICs, agricultural products, minerals from ASEAN. Cross-border e-commerce grew rapidly, reaching ¥2.75 trillion in 2025.'},
 products:{zh:'重点机会品类：1)电子产品与半导体（越南、马来西亚是重要电子制造基地）；2)纺织品与面辅料（东南亚纺织服装产业链完善）；3)机械设备与工业品；4)家电与消费电子（6.8亿人口的大众消费市场）；5)汽车及零配件（泰国是东南亚汽车制造中心）；6)新能源产品（各国推进绿色转型）；7)建材与家居；8)食品与日用品；9)箱包（东南亚是重要生产基地和消费市场）。RCEP关税减让和原产地累积规则为区域供应链整合提供便利。',en:'Key opportunity categories: 1) Electronics & semiconductors (Vietnam, Malaysia are major electronics manufacturing bases); 2) Textiles & fabrics (complete textile supply chain in SE Asia); 3) Machinery & industrial products; 4) Appliances & consumer electronics (mass consumer market of 680M); 5) Vehicles & parts (Thailand is SE Asia\'s auto manufacturing center); 6) New energy products (green transition across countries); 7) Building materials & home furnishings; 8) Food & daily necessities; 9) Bags & luggage (SE Asia is both a production base and consumer market). RCEP tariff reductions and cumulative rules of origin facilitate regional supply chain integration.'},
 prospect:{zh:'东盟经济持续增长，越南、菲律宾、印尼等国GDP增速5-6%。RCEP持续深化区域一体化。数字经济蓬勃发展，电商市场预计2025年超2300亿美元。制造业转移加速，中国-东盟供应链深度融合。中老铁路等基础设施互联互通项目促进贸易便利化。中国连续3年保持东盟最大贸易伙伴。风险：部分国家营商环境待改善、南海争端、全球经济放缓影响出口。',en:'ASEAN economies continue to grow, with Vietnam, Philippines, Indonesia at 5-6% GDP growth. RCEP deepens regional integration. Digital economy is booming, e-commerce market expected to exceed $230B by 2025. Manufacturing relocation accelerates, China-ASEAN supply chains are deeply integrated. Infrastructure projects like China-Laos Railway promote trade facilitation. China has been ASEAN\'s largest trading partner for 3 consecutive years. Risks: some countries\' business environment needs improvement, South China Sea disputes, global economic slowdown affecting exports.'}},

 {id:'caribbean',icon:'',name:{zh:'加勒比国家',en:'Caribbean Countries',fr:'Pays des Caraïbes',ar:'دول البحر الكاريبي'},
 desc:{zh:'加勒比地区包括古巴、牙买加、特立尼达和多巴哥、巴巴多斯等20多个国家和地区，总人口约4400万。经济以旅游业、农业、矿业和金融服务为主。多数国家为小型岛国经济体，市场规模有限但消费品高度依赖进口。中国是该地区重要贸易伙伴，2025年对拉美地区进出口3.93万亿元（+6.5%）。加勒比国家多为小岛屿发展中国家，面临气候变化挑战，在新能源、基础设施和日用品方面对中国产品有较大需求。',en:'The Caribbean region includes Cuba, Jamaica, Trinidad and Tobago, Barbados and 20+ other countries/territories, with ~44 million people. Economies rely on tourism, agriculture, mining, and financial services. Most are small island economies with limited markets but high import dependence for consumer goods. China is an important trade partner, with Latin America trade reaching ¥3.93 trillion in 2025 (+6.5%). Caribbean nations are mostly SIDS facing climate challenges, with significant demand for Chinese products in new energy, infrastructure, and daily necessities.',fr:'La région des Caraïbes comprend Cuba, la Jamaïque, Trinité-et-Tobago, la Barbade et plus de 20 autres pays/territoires, avec ~44 millions d\'habitants. Les économies dépendent du tourisme, de l\'agriculture, des mines et des services financiers. La plupart sont de petites économies insulaires avec une forte dépendance aux importations.',ar:'تشمل منطقة البحر الكاريبي كوبا وجامايكا وترينيداد وتوباغو وبربادوس وأكثر من 20 دولة، بإجمالي سكان ~44 مليون. تعتمد الاقتصادات على السياحة والزراعة والتعدين والخدمات المالية. معظمها جزر صغيرة ذات أسواق محدودة لكنها تعتمد بشدة على الواردات.'},
 trade:{zh:'中国对加勒比地区贸易以古巴为主要伙伴（2025年贸易额13.11亿美元）。中国向该地区主要出口机电产品、日用品、建材、纺织品等。该地区国家普遍消费品依赖进口，中国产品具有价格竞争力。牙买加等国是中国在加勒比地区的重要贸易伙伴。2025年中国对拉美整体进出口增长6.5%，出口增速快于整体。',en:'China\'s Caribbean trade centers on Cuba ($1.31B in 2025). China mainly exports electromechanical products, daily necessities, building materials, textiles to the region. These countries generally depend on imports for consumer goods, where Chinese products are price-competitive. Jamaica and others are important trade partners. In 2025, China\'s overall Latin America trade grew 6.5%, with export growth faster than the overall rate.'},
 products:{zh:'重点机会品类：1)新能源设备（太阳能、风能，岛国能源转型需求迫切）；2)家电与消费电子（日用品进口依赖度高）；3)建材与家居（旅游业发展带动酒店和基础设施建设）；4)食品与日用品；5)纺织服装与鞋类；6)交通工具（电动车、公交车等）；7)医疗用品。加勒比地区对中国产品的需求特点是：品种多样、单次采购量不大但持续性强，适合发展跨境电商和贸易中间商模式。',en:'Key opportunity categories: 1) New energy equipment (solar, wind - urgent island energy transition needs); 2) Appliances & consumer electronics (high import dependence); 3) Building materials & home furnishings (tourism development drives hotel and infrastructure construction); 4) Food & daily necessities; 5) Textiles, clothing & footwear; 6) Transportation (EVs, buses); 7) Medical supplies. Caribbean demand characteristics: diverse product variety, small per-order volumes but sustained demand, suitable for cross-border e-commerce and trading intermediary models.'},
 prospect:{zh:'加勒比国家积极推进绿色转型和气候适应，新能源和基础设施是重点领域。中国与加勒比国家通过中拉论坛等机制加强合作。旅游业的持续恢复将带动相关设备和消费品进口。该地区国家面临气候变化、债务压力等挑战，部分国家经济脆弱性较高。古巴经济困难但改革意愿增强。中国对拉美贸易整体增长态势良好。风险：飓风等自然灾害、全球旅游业波动、部分国家支付能力有限。',en:'Caribbean nations are actively promoting green transition and climate adaptation, with new energy and infrastructure as key areas. China strengthens cooperation through the China-CELAC Forum mechanism. Tourism recovery will drive related equipment and consumer goods imports. These countries face climate change, debt pressure challenges, with some having high economic vulnerability. Cuba\'s economy is difficult but reform willingness is growing. China\'s overall Latin America trade maintains good growth momentum. Risks: hurricanes and natural disasters, global tourism volatility, limited payment capacity in some countries.'}}
];

function getName(obj){return obj.name[lang]||obj.name.en||obj.name.zh;}
function getDesc(obj){return(obj.desc&&obj.desc[lang])||obj.desc.en||'';}
function getOverview(obj){return(obj.overview&&obj.overview[lang])||obj.overview.en||'';}
function getTrade(obj){return(obj.trade&&obj.trade[lang])||obj.trade.en||'';}
function getProducts(obj){return(obj.products&&obj.products[lang])||obj.products.en||'';}
function getProspect(obj){return(obj.prospect&&obj.prospect[lang])||obj.prospect.en||'';}

function render(){
 /* Stats */
 document.getElementById('statsBar').innerHTML=
 '<div class="stat-card"><div class="num">'+COUNTRIES.length+'</div><div class="unit">'+t('stat_countries')+'</div></div>'+
 '<div class="stat-card"><div class="num">'+REGIONS.length+'</div><div class="unit">'+t('stat_regions')+'</div></div>'+
 '<div class="stat-card"><div class="num">150+</div><div class="unit">'+t('stat_belt')+'</div></div>';

 /* Countries */
 var cg=document.getElementById('countryGrid');cg.innerHTML='';
 COUNTRIES.forEach(function(c){
 var d=document.createElement('div');d.className='country-card';
 d.innerHTML='<div class="flag">'+c.flag+'</div><div class="name">'+getName(c)+'</div><div class="name-en">'+c.name.en+'</div><div class="tag">'+c.tag+'</div>';
 d.onclick=function(){showDetail(c);};
 cg.appendChild(d);
 });

 /* Regions */
 var rg=document.getElementById('regionGrid');rg.innerHTML='';
 REGIONS.forEach(function(r){
 var d=document.createElement('div');d.className='region-card';
 d.innerHTML='<div class="icon">'+r.icon+'</div><div class="name">'+getName(r)+'</div><div class="desc">'+getDesc(r).substring(0,80)+'...</div>';
 d.onclick=function(){showDetail(r);};
 rg.appendChild(d);
 });
}

function showDetail(c){
 var box=document.getElementById('detailBox');
 var isRegion=!c.pop;
 var icon=c.flag||c.icon||'';
 var sub=c.name.en+(c.tag?' · '+c.tag:'')+(c.population?' · '+c.population+'':'');
 var statsHtml=isRegion?'':'<strong>'+(c.pop||c.population||'')+'</strong> 人口 · <strong>'+(c.gdp||'')+'</strong> GDP<br>';
 var overviewText=isRegion?getDesc(c):getOverview(c);
 box.innerHTML=
 '<div class="top"><div class="flag">'+icon+'</div><div><h2>'+getName(c)+'</h2><div class="en">'+sub+'</div></div></div>'+
 '<div class="block"><div class="lbl"> '+t('lbl_overview')+'</div><div class="val">'+statsHtml+overviewText+'</div></div>'+
 '<div class="block"><div class="lbl"> '+t('lbl_trade')+'</div><div class="val">'+(getTrade(c)||getOverview(c))+'</div></div>'+
 '<div class="block"><div class="lbl"> '+t('lbl_products')+'</div><div class="val">'+(getProducts(c)||getDesc(c))+'</div></div>'+
 '<div class="block"><div class="lbl"> '+t('lbl_prospect')+'</div><div class="val">'+(getProspect(c)||getDesc(c))+'</div></div>'+
 '<button class="close-btn" onclick="closeDetail()">'+t('close')+'</button>';
 document.getElementById('overlay').classList.add('show');
}
function closeDetail(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',function(e){if(e.target.id==='overlay')closeDetail();});

render();
</script>
</body>
</html>
