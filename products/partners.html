*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1a5276;--accent:#2e86c1;--gold:#d4a017;--bg:#f8f9fa;--card:#fff;--text:#2c3e50;--light:#7f8c8d;--border:#e0e0e0;--radius:12px}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
/* Nav */
nav{background:linear-gradient(135deg,var(--primary),var(--accent));padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.15)}
nav .logo{color:#fff;font-size:20px;font-weight:700;letter-spacing:1px}
nav .links{display:flex;gap:16px;align-items:center}
nav a{color:rgba(255,255,255,.85);text-decoration:none;font-size:14px;transition:.2s}
nav a:hover{color:#fff}
nav .lang-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.2s}
nav .lang-btn:hover,.lang-btn.active{background:rgba(255,255,255,.3)}
/* Hero */
.hero{background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 50%,#1a8a5e 100%);color:#fff;padding:60px 24px;text-align:center}
.hero h1{font-size:36px;margin-bottom:12px;letter-spacing:2px}
.hero p{font-size:16px;opacity:.85;max-width:600px;margin:0 auto}
/* Stats */
.stats{display:flex;justify-content:center;gap:40px;padding:30px 24px;background:#fff;border-bottom:1px solid var(--border)}
.stat-num{font-size:32px;font-weight:700;color:var(--accent)}
.stat-label{font-size:13px;color:var(--light)}
/* Category Tabs */
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:24px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
.tab{padding:8px 20px;border-radius:20px;cursor:pointer;font-size:14px;border:1px solid var(--border);background:#fff;transition:.2s;white-space:nowrap}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:24px;max-width:1200px;margin:0 auto}
/* Card */
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;cursor:pointer;border:1px solid var(--border)}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card-icon{height:80px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,rgba(26,82,118,.06),rgba(46,134,193,.06))}
.card-body{padding:16px}
.card-body h3{font-size:16px;margin-bottom:6px;color:var(--primary)}
.card-body .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(46,134,193,.1);color:var(--accent);margin-bottom:8px}
.card-body p{font-size:13px;color:var(--light);line-height:1.5}
.card-tags{padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:4px}
.card-tags span{padding:2px 6px;border-radius:8px;font-size:10px;background:rgba(212,160,23,.08);color:var(--gold)}
/* Detail Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);max-width:700px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative}
.modal-header{padding:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px}
.modal-header .m-icon{font-size:48px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:rgba(46,134,193,.08);border-radius:12px}
.modal-header h2{font-size:20px;color:var(--primary)}
.modal-header .m-tag{font-size:12px;color:var(--accent)}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.06);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(0,0,0,.12)}
.modal-body{padding:24px}
.modal-body h4{font-size:14px;color:var(--primary);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent);display:inline-block}
.modal-body h4:first-child{margin-top:0}
.modal-body p{font-size:14px;color:var(--text);line-height:1.7;margin-bottom:8px}
.modal-body ul{padding-left:20px;margin-bottom:8px}
.modal-body li{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:4px}
.capability-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0 16px}
.capability-item{padding:8px;background:rgba(46,134,193,.04);border-radius:8px;text-align:center;font-size:12px;color:var(--text)}
.capability-item strong{display:block;color:var(--accent);font-size:18px;margin-bottom:2px}
/* Footer */
footer{background:var(--primary);color:rgba(255,255,255,.7);padding:24px;text-align:center;font-size:12px}
footer a{color:rgba(255,255,255,.9);text-decoration:none}
/* RTL */
[dir="rtl"] nav .links{direction:ltr}
[dir="rtl"] .tabs{direction:ltr}
/* Responsive */
@media(max-width:640px){
  .hero h1{font-size:24px}
  .stats{gap:20px;flex-wrap:wrap}
  .stat-num{font-size:24px}
  .grid{grid-template-columns:1fr}
  nav .links{gap:8px}
}
</style>

var CATS = ['all','cert','logistics','finance','legal','digital','exhibition','translate'];
var curCat = 'all';

// ============ Render ============
function switchLang(l){
  lang=l; localStorage.setItem('yq_lang',l);
  if(l==='ar') document.documentElement.dir='rtl'; else document.documentElement.dir='ltr';
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.getAttribute('data-i18n')));
  renderTabs(); renderGrid(); updateStats();
}

function renderTabs(){
  var html='';
  CATS.forEach(c=>{
    html+='<div class="tab'+(c===curCat?' active':'')+'" onclick="setCat(\''+c+'\')">'+t('cat_'+c)+'</div>';
  });
  document.getElementById('tabs').innerHTML=html;
}

function setCat(c){ curCat=c; renderTabs(); renderGrid(); }

function getName(p){ return (p.name[lang]||p.name.zh); }
function getTagline(p){ return (p.tagline[lang]||p.tagline.zh); }
function getDesc(p){ return (p.desc[lang]||p.desc.zh); }

function renderGrid(){
  var list = curCat==='all' ? PARTNERS : PARTNERS.filter(p=>p.category===curCat);
  var html='';
  list.forEach(p=>{
    html+='<div class="card" onclick="openModal(\''+p.id+'\')">';
    html+='<div class="card-icon">'+p.icon+'</div>';
    html+='<div class="card-body"><h3>'+getName(p)+'</h3>';
    html+='<span class="tag">'+getTagline(p)+'</span>';
    html+='<p>'+getDesc(p).substring(0,80)+'...</p></div>';
    html+='<div class="card-tags">';
    p.tags.forEach(tg=>html+='<span>'+tg+'</span>');
    html+='</div></div>';
});
  document.getElementById('grid').innerHTML=html;
}

function openModal(id){
  var p = PARTNERS.find(x=>x.id===id);
  if(!p) return;
  var h='<div class="m-icon">'+p.icon+'</div><div><h2>'+getName(p)+'</h2><div class="m-tag">'+getTagline(p)+'</div></div$>';
  document.getElementById('modalHeader').innerHTML=h;
  var b='';
  // Capabilities
  b+='<div class="capability-grid">';
  p.capabilities.forEach(c=>b+='<div class="capability-item"><strong>'+c.n+'</strong>'+c.l+'</div>');
  b+='</div>';
  // Description
  b+='<h4>'+(lang==='zh'?'机构简介':'About')+'</h4><p>'+getDesc(p)+'</p>';
  // Services
  var svcs = p.services[lang]||p.services.zh;
  b+='<h4>'+(lang==='zh'?'核心服务':'Core Services')+'</h4><ul>';
  svcs.forEach(s=>b+='<li>'+s+'</li>');
  b+='</ul>';
  // Why partner
  var why = p.why[lang]||p.why.zh;
  b+='<h4>'+(lang==='zh'?'合作价值':'Partnership Value')+'</h4><p>'+why+'</p>';
  document.getElementById('modalBody').innerHTML=b;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

function updateStats(){
  document.getElementById('statPartners').textContent=PARTNERS.length;
  var cats=new Set(PARTNERS.map(p=>p.category));
  document.getElementById('statCats').textContent=cats.size;
  var countries=new Set();
  PARTNERS.forEach(p=>countries.add(p.countries));
  document.getElementById('statCountries').textContent=Math.max(...PARTNERS.map(p=>p.countries));
}

// Init
switchLang(lang);
</script>
