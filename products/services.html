<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务 - 云桥国际</title>
<style>
:root{--navy:#0F2544;--navy-l:#1A3A6B;--gold:#C9A24B;--ink:#1A2333;--muted:#6B7686;--line:#E6EAF0;--bg:#F7F8FA;--white:#fff;--price:#ff5000;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
nav{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px}
nav .logo{font-size:15px;font-weight:800}
nav .links{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
nav .links a{color:#cfd8e6;font-size:13px;text-decoration:none;padding:5px 10px;border-radius:6px;cursor:pointer}
nav .links a.on{color:#fff;background:rgba(255,255,255,.14)}
.lang-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;cursor:pointer}
.lang-btn.on{background:var(--gold);color:var(--navy)}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-l) 100%);color:#fff;padding:48px 24px;text-align:center}
.hero h1{font-size:28px;margin-bottom:10px;letter-spacing:1px}
.hero p{font-size:14px;opacity:.85;max-width:640px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:24px;max-width:1080px;margin:0 auto}
.card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;cursor:pointer;border:1px solid var(--line)}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card-icon{height:80px;display:flex;align-items:center;justify-content:center;font-size:40px;background:linear-gradient(135deg,rgba(15,37,68,.05),rgba(201,162,75,.06))}
.card-body{padding:16px}
.card-body h3{font-size:16px;margin-bottom:6px;color:var(--navy)}
.card-body .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(201,162,75,.12);color:#8a6d1a;margin-bottom:8px}
.card-body p{font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:4px}
.card-tags span{padding:2px 6px;border-radius:8px;font-size:10px;background:rgba(201,162,75,.08);color:var(--gold)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);max-width:700px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);position:relative}
.modal-header{padding:24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px}
.modal-header .m-icon{font-size:44px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:rgba(201,162,75,.08);border-radius:12px}
.modal-header h2{font-size:20px;color:var(--navy)}
.modal-header .m-tag{font-size:12px;color:#8a6d1a}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.06);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:24px}
.modal-body h4{font-size:14px;color:var(--navy);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--gold);display:inline-block}
.modal-body h4:first-child{margin-top:0}
.modal-body p{font-size:14px;color:var(--ink);line-height:1.7;margin-bottom:8px}
.modal-body ul{padding-left:20px;margin-bottom:8px}
.modal-body li{font-size:13px;line-height:1.6;color:var(--ink);margin-bottom:4px}
.capability-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0 16px}
.capability-item{padding:8px;background:rgba(201,162,75,.05);border-radius:8px;text-align:center;font-size:12px;color:var(--ink)}
.capability-item strong{display:block;color:#8a6d1a;font-size:18px;margin-bottom:2px}
footer{background:var(--navy);color:rgba(255,255,255,.7);padding:24px;text-align:center;font-size:12px}
footer a{color:rgba(255,255,255,.9);text-decoration:none}
[dir="rtl"] nav .links{direction:ltr}
@media(max-width:640px){
 .hero h1{font-size:22px}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav>

function getName(p){return(p.name[lang]||p.name.zh)}
function getTagline(p){return(p.tagline[lang]||p.tagline.zh)}
function getDesc(p){return(p.desc[lang]||p.desc.zh)}

function renderGrid(){
 var html='';
 SERVICES.forEach(function(p){
  html+='<div class="card" onclick="openModal(\''+p.id+'\')">';
  html+='<div class="card-icon">'+p.icon+'</div>';
  html+='<div class="card-body"><h3>'+getName(p)+'</h3>';
  html+='<span class="tag">'+getTagline(p)+'</span>';
  html+='<p>'+getDesc(p)+'</p></div>';
  html+='<div class="card-tags">';
  p.tags.forEach(function(tg){html+='<span>'+tg+'</span>'});
  html+='</div></div>';
 });
 document.getElementById('grid').innerHTML=html;
}

function openModal(id){
 var p=SERVICES.find(function(x){return x.id===id});
 if(!p) return;
 document.getElementById('modalHeader').innerHTML='<div class="m-icon">'+p.icon+'</div><div><h2>'+getName(p)+'</h2><div class="m-tag">'+getTagline(p)+'</div></div>';
 var b='<div class="capability-grid">';
 p.capabilities.forEach(function(c){b+='<div class="capability-item"><strong>'+c.n+'</strong>'+c.l+'</div>'});
 b+='</div>';
 b+='<h4>'+t('about')+'</h4><p>'+getDesc(p)+'</p>';
 var svcs=p.services[lang]||p.services.zh;
 b+='<h4>'+t('core')+'</h4><ul>';
 svcs.forEach(function(s){b+='<li>'+s+'</li>'});
 b+='</ul>';
 b+='<h4>'+t('value')+'</h4><p>'+(p.why[lang]||p.why.zh)+'</p>';
 document.getElementById('modalBody').innerHTML=b;
 document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

function sw(l){
 lang=l;localStorage.setItem('yq_lang',l);
 if(l==='ar')document.documentElement.dir='rtl';else document.documentElement.dir='ltr';
 document.documentElement.lang=l;
 document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'))});
 document.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('on')});
 renderGrid();
}

renderGrid();
</script>
</body>
</html>
