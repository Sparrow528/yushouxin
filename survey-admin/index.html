<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>问卷数据中心 | 云桥国际</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#f4f6f9;color:#1c2733;min-height:100vh}
/* ===== 密钥门 ===== */
#gate{max-width:460px;margin:12vh auto;background:#fff;border-radius:16px;padding:38px 34px;box-shadow:0 6px 28px rgba(15,37,68,.10)}
#gate h1{font-size:22px;color:#0F2544;margin-bottom:6px}
#gate .sub{font-size:13px;color:#6b7c90;margin-bottom:22px;line-height:1.7}
#gate input{width:100%;padding:13px 14px;border:1px solid #d5dce5;border-radius:9px;font-size:13px;font-family:Consolas,monospace;outline:none}
#gate input:focus{border-color:#0F2544}
#gate button{width:100%;margin-top:12px;padding:13px;background:#0F2544;color:#fff;border:0;border-radius:9px;font-size:15px;cursor:pointer;font-weight:600}
#gate button:hover{background:#16386a}
.tipbox{margin-top:16px;background:#fff8e6;border:1px solid #f0d89a;border-radius:9px;padding:12px 14px;font-size:12px;color:#8a6d20;line-height:1.75}
#gateMsg{margin-top:14px;font-size:13px;color:#c0392b;min-height:18px}
/* ===== 主体 ===== */
header{background:#0F2544;color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h2{font-size:18px;font-weight:600}
header .sp{flex:1}
.btn{background:rgba(255,255,255,.14);color:#fff;border:0;padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.danger{background:#c0392b}
.btn.danger:hover{background:#a93226}
.btn.danger:disabled{opacity:.4;cursor:not-allowed}
th.selcol,td.selcol{width:34px;text-align:center;padding:8px 4px}
th.selcol input,td.selcol input{width:16px;height:16px;cursor:pointer;accent-color:#c0392b}
tr.picked td{background:#fff5f4}
.wrap{padding:18px 22px}
.cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.card{background:#fff;border-radius:11px;padding:16px 20px;box-shadow:0 2px 10px rgba(15,37,68,.07);min-width:132px}
.card .n{font-size:27px;font-weight:700;color:#0F2544}
.card .l{font-size:12px;color:#6b7c90;margin-top:3px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input[type=search]{flex:1;min-width:200px;padding:10px 13px;border:1px solid #d5dce5;border-radius:8px;font-size:14px;outline:none}
.bar input[type=search]:focus{border-color:#0F2544}
.bar .b2{padding:10px 16px;background:#fff;border:1px solid #d5dce5;border-radius:8px;font-size:13px;cursor:pointer;color:#0F2544}
.bar .b2:hover{background:#eef2f7}
.tablebox{background:#fff;border-radius:11px;box-shadow:0 2px 10px rgba(15,37,68,.07);overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{border-bottom:1px solid #eaeef3;padding:9px 11px;text-align:left;vertical-align:top}
th{background:#0F2544;color:#fff;position:sticky;top:0;z-index:2;font-weight:600}
tbody tr:hover td{background:#f7f9fc}
td.idx{background:#f4f6f9;color:#8b98a8;text-align:center}
.tagv2{display:inline-block;background:#2a5ba8;color:#fff;font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px;margin-top:3px}
.tagv1{display:inline-block;background:#9aa8b8;color:#fff;font-size:9px;font-weight:700;border-radius:3px;padding:1px 4px;margin-top:3px}
/* 版本筛选 */
.vgrp{display:flex;gap:6px;flex-shrink:0}
.vb{padding:10px 14px;background:#fff;border:1px solid #d5dce5;border-radius:8px;font-size:13px;cursor:pointer;color:#37475c}
.vb:hover{background:#eef2f7}
.vb.on{background:#0F2544;color:#fff;border-color:#0F2544;font-weight:600}
td.wrapcell{white-space:normal;max-width:260px;word-break:break-word}
.empty{padding:44px;text-align:center;color:#8b98a8;font-size:14px}
/* ===== 自动统计 ===== */
#statBox{margin-bottom:16px}
.stat-head{font-size:15px;font-weight:700;color:#0F2544;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e6eaf0}
.stat-head span{font-size:12px;font-weight:400;color:#6b7c90;margin-left:8px}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:13px}
.srow .nm{width:170px;flex-shrink:0;color:#37475c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .bar-bg{flex:1;background:#eef2f7;border-radius:5px;height:18px;overflow:hidden;min-width:80px}
.srow .bar-fill{height:100%;background:linear-gradient(90deg,#0F2544,#2a5ba8);border-radius:5px;transition:width .3s}
.srow .vv{width:78px;flex-shrink:0;text-align:right;color:#6b7c90;font-size:12px}
.stat-note{background:#eef4ff;border:1px solid #cfe0f5;border-radius:9px;padding:11px 14px;font-size:12.5px;color:#2a4a75;line-height:1.7;margin-bottom:8px}
@media(max-width:640px){.srow .nm{width:110px}.srow .vv{width:62px}}
a{color:#1a5fb4;text-decoration:none}
/* ===== 移动端 ===== */
@media(max-width:640px){
  .wrap{padding:14px}
  header{padding:14px}
  header h2{font-size:16px;width:100%}
  .card .n{font-size:22px}
}
</style>
</head>
<body>

<!-- ============ 密钥输入门 ============ -->
<div id="gate">
  <h1>问卷数据中心</h1>
  <div class="sub">中国商务考察团调查问卷 · 数据查看与导出</div>
  <input type="password" id="keyInput" placeholder="粘贴 Supabase service_role 密钥 (sb_secret_...)" autocomplete="off">
  <button onclick="doLoad()">载入数据</button>
  <div id="gateMsg"></div>
  <div class="tipbox">
    <b>安全说明</b><br>
    · 密钥仅用于本次请求，保存在浏览器内存中，<b>不会上传、不会写入任何文件、不会进代码仓库</b><br>
    · 关闭或刷新页面即自动清除<br>
    · 建议用完后到 Supabase 后台重置该密钥
  </div>
</div>

<!-- ============ 数据主体 ============ -->
<div id="app" style="display:none">
  <header>
    <h2>问卷数据中心</h2>
    <span class="sp"></span>
    <button class="btn" onclick="doLoad()">刷新</button>
    <button class="btn" onclick="exportCSV()">导出 CSV</button>
    <button class="btn danger" id="delBtn" onclick="deleteSelected()" disabled>删除选中</button>
    <button class="btn" onclick="logout()">清除密钥</button>
  </header>
  <div class="wrap">
    <div class="cards">
      <div class="card"><div class="n" id="cTotal">0</div><div class="l">总提交数</div></div>
      <div class="card"><div class="n" id="cToday">0</div><div class="l">今日新增</div></div>
      <div class="card"><div class="n" id="cV2">0</div><div class="l">选择版(V2)</div></div>
      <div class="card"><div class="n" id="cV1">0</div><div class="l">开放版(V1)</div></div>
      <div class="card"><div class="n" id="cLast">-</div><div class="l">最近提交</div></div>
      <div class="card"><div class="n" id="cShow">0</div><div class="l">当前显示</div></div>
    </div>
    <div id="statBox"></div>
    <div class="bar">
      <div class="vgrp">
        <button class="vb on" id="vb-all" onclick="setVer('all')">全部</button>
        <button class="vb" id="vb-v2" onclick="setVer('v2')">选择版 V2</button>
        <button class="vb" id="vb-v1" onclick="setVer('v1')">开放版 V1</button>
      </div>
      <input type="search" id="q" placeholder="搜索姓名 / 电话 / 单位 / 任意关键词…" oninput="render()">
      <button class="b2" onclick="exportCSV()">导出当前结果</button>
    </div>
    <div class="tablebox"><div id="tableHost"></div></div>
  </div>
</div>

<script>
/* ===== 配置 ===== */
var PROJECT = "mbrkbqbauhzugmqlldot";
var API = "https://" + PROJECT + ".supabase.co/rest/v1/survey_responses";

/* 字段 -> 中文表头（顺序与数据库一致） */
var FIELDS = [
  ["q1_name","姓名"],["q2_dept","部门/单位"],["q3_position","职务"],
  ["q4_phone","电话"],["q5_email","邮箱"],["q6_whatsapp","WhatsApp"],["q7_wechat","微信"],
  ["q8_goods","主要商品"],["q9_quality","品质要求"],["q10_companies","合作过的中国公司"],
  ["q11_purpose","本次考察目的"],["q12_import","主要进口品类"],["q13_export","主要出口品类"],
  ["q14_cooperation","希望合作方向"],["q15_others","其他需求/备注"],
  ["created_at","提交时间"]
];
var LONG_FIELDS = {q8_goods:1,q9_quality:1,q10_companies:1,q11_purpose:1,q12_import:1,q13_export:1,q14_cooperation:1,q15_others:1};

/* 可自动统计的结构化字段（对应选择版 V2 的多选题） */
var STAT_FIELDS = [
  ["q8_goods","第8题 拟采购品类"],
  ["q9_quality","第9题 质量/价格要求"],
  ["q10_companies","第10题 拟考察企业类型"],
  ["q11_purpose","第11题 考察目的"],
  ["q12_import","第12题 拟进口品类"],
  ["q13_export","第13题 拟出口品类"],
  ["q14_cooperation","第14题 希望合作方式"]
];
/* V2 版本标记写在 user_agent 前缀 */
function isV2(r){ return String(r.user_agent||"").indexOf("V2|") === 0; }

var SEL = {};      // 勾选状态 {id:true}
var KEY = "";      // 仅存于内存
var ROWS = [];     // 原始数据
var VIEW = [];     // 当前筛选后
var VER_FILTER = "all";  // 版本筛选：all / v2（选择版）/ v1（开放版）

function setVer(v){
  VER_FILTER = v;
  ["all","v2","v1"].forEach(function(x){
    var b = document.getElementById("vb-"+x);
    if(b) b.classList.toggle("on", x === v);
  });
  render();
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

function fmtTime(v){
  if(!v) return "";
  var d = new Date(v);
  if(isNaN(d)) return String(v);
  var p = function(n){return n<10?"0"+n:n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}

function cellHTML(k,v){
  v = v==null?"":String(v);
  if(!v) return "";
  if(k==="q4_phone") return '<a href="tel:'+esc(v)+'">'+esc(v)+'</a>';
  if(k==="q5_email") return '<a href="mailto:'+esc(v)+'">'+esc(v)+'</a>';
  if(k==="created_at") return esc(fmtTime(v));
  return esc(v);
}

function doLoad(){
  var input = document.getElementById("keyInput");
  var msg = document.getElementById("gateMsg");
  var k = (KEY || (input?input.value.trim().replace(/[\u00A0\u3000]/g,""):""));
  if(!k){ msg.textContent = "请先粘贴 service_role 密钥"; return; }
  /* ---- 密钥格式自检：把常见坑直接挡在门外 ---- */
  if(k.indexOf("\u2022")>=0 || k.indexOf("...")>=0){
    msg.textContent = "❌ 你复制的是打码文本（含 •••• 或 ...），不是真密钥。请先点密钥右边的眼睛图标👁显示完整内容，再点旁边的复制按钮📋";
    return;
  }
  if(k.indexOf("sb_publishable_")===0){
    msg.textContent = "❌ 这是公开 key（publishable），只有写入权限、读不了数据。请复制页面下方 Secret keys 区域 sb_secret_ 开头的那串";
    return;
  }
  if(k.indexOf("sb_secret_")!==0 && k.indexOf("eyJ")!==0){
    msg.textContent = "⚠️ 密钥格式可疑：service_role 应以 sb_secret_ 开头（旧版是 eyJ 开头）。请回 Supabase → Settings → API Keys → Secret keys 重新复制";
    return;
  }
  if(k.length < 30){
    msg.textContent = "❌ 密钥长度不足（当前 " + k.length + " 字符），大概率复制不完整。请用眼睛图标显示后点复制按钮，不要手动拖选";
    return;
  }
  msg.textContent = "正在读取…";
  KEY = k;
  var select = "id," + FIELDS.map(function(f){return f[0];}).join(",") + ",user_agent";
  fetch(API + "?select=" + select + "&order=id.asc&limit=5000", {
    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Accept": "application/json" }
  }).then(function(r){
    if(!r.ok){
      return r.json().then(function(err){
        var d = (err && (err.message || err.error_description || err.msg)) || "";
        if(d.indexOf("Forbidden use of secret")>=0){
          throw new Error("HTTP 401：Supabase 新版安全机制禁止在浏览器用新版 secret key。→ 解决：回 API Keys 页面，顶部切到 Legacy API keys 标签 → 启用后复制 eyJ 开头的 service_role → 粘到这里");
        }
        throw new Error("HTTP " + r.status + (d ? "（Supabase 说：" + d + "）" : "（密钥被拒绝）"));
      }, function(){ throw new Error("HTTP " + r.status + "（密钥被拒绝）"); });
    }
    return r.json();
  }).then(function(rows){
    if(!Array.isArray(rows)) throw new Error("返回格式异常");
    ROWS = rows;
    SEL = {};
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    stats(); render();
  }).catch(function(e){
    msg.textContent = "读取失败：" + e.message;
    if(e.message.indexOf("Failed to fetch")>=0) msg.textContent += "（网络不通，请检查连接）";
  });
}

function stats(){
  document.getElementById("cTotal").textContent = ROWS.length;
  var today = new Date(); today.setHours(0,0,0,0);
  var n = 0, v2 = 0;
  ROWS.forEach(function(r){
    if(isV2(r)) v2++;
    if(!r.created_at) return;
    var d = new Date(r.created_at);
    if(!isNaN(d) && d >= today) n++;
  });
  document.getElementById("cToday").textContent = n;
  document.getElementById("cV2").textContent = v2;
  document.getElementById("cV1").textContent = ROWS.length - v2;
  document.getElementById("cLast").textContent = ROWS.length ? fmtTime(ROWS[ROWS.length-1].created_at) : "-";
  buildStats(v2);
}

/* ===== 结构化选项自动统计（仅统计 V2 选择版） ===== */
function buildStats(v2count){
  var box = document.getElementById("statBox");
  if(!box) return;
  var v2rows = ROWS.filter(isV2);
  if(!v2rows.length){
    box.innerHTML = '<div class="stat-note">当前还没有「选择版(V2)」数据。若有开放版(V1)填写的自由文本，'
      + '可在下方表格逐条查看，或用搜索框检索关键词。</div>';
    return;
  }
  var html = '<div class="stat-note">以下为「选择版(V2)」问卷的自动统计，共 <b>'+v2rows.length
    + '</b> 份；百分比＝勾选该项的人数 ÷ 该题有效填写人数（多选题合计可超过 100%）。</div>';
  STAT_FIELDS.forEach(function(f){
    var key = f[0], label = f[1];
    var cnt = {}, answered = 0;
    v2rows.forEach(function(r){
      var raw = String(r[key]||"").trim();
      if(!raw) return;
      answered++;
      var opts = raw.split("｜")[0];          // 去掉｜后的自由文本备注
      opts.split("、").forEach(function(t){
        t = String(t||"").trim();
        if(!t) return;
        if(t.indexOf("其他：") === 0) t = "其他（自定义）";
        cnt[t] = (cnt[t]||0) + 1;
      });
    });
    html += '<div class="stat-head">'+esc(label)+'<span>有效填写 '+answered+' 份</span></div>';
    if(!answered){
      html += '<div class="empty" style="padding:14px">该题暂无数据</div>';
      return;
    }
    var arr = Object.keys(cnt).map(function(k){return [k,cnt[k]];})
                    .sort(function(a,b){return b[1]-a[1];});
    var max = arr[0][1] || 1;
    arr.forEach(function(it){
      var pct = Math.round(it[1] / answered * 100);
      html += '<div class="srow"><div class="nm" title="'+esc(it[0])+'">'+esc(it[0])+'</div>'
           +  '<div class="bar-bg"><div class="bar-fill" style="width:'+Math.round(it[1]/max*100)+'%"></div></div>'
           +  '<div class="vv">'+it[1]+' 人 · '+pct+'%</div></div>';
    });
  });
  box.innerHTML = html;
}

function render(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  VIEW = ROWS.filter(function(r){
    /* 版本筛选：V2=选择版（user_agent 前缀 V2|），V1=开放版 */
    var v2 = isV2(r);
    if(VER_FILTER === "v2" && !v2) return false;
    if(VER_FILTER === "v1" &&  v2) return false;
    if(!q) return true;
    return FIELDS.some(function(f){ return String(r[f[0]]==null?"":r[f[0]]).toLowerCase().indexOf(q) >= 0; });
  });
  document.getElementById("cShow").textContent = VIEW.length;

  if(!VIEW.length){
    document.getElementById("tableHost").innerHTML =
      '<div class="empty">' + (ROWS.length ? "没有匹配的记录（试试切换版本筛选或清空搜索）" : "该表当前没有任何数据") + '</div>';
    return;
  }
  var th = "<th class='selcol'><input type='checkbox' id='ckAll' title='全选当前显示' onchange='toggleAll(this.checked)'></th>" +
           "<th>#</th>" + FIELDS.map(function(f){ return "<th>"+esc(f[1])+"</th>"; }).join("");
  var trs = VIEW.map(function(r,i){
    var ckOn = SEL[String(r.id)] ? " checked" : "";
    var ck = "<td class='selcol'><input type='checkbox' class='rowck' data-id='"+esc(String(r.id))+"'"+
             ckOn+" onchange='toggleRow(this)'></td>";
    var tds = FIELDS.map(function(f){
      var cls = LONG_FIELDS[f[0]] ? " class='wrapcell'" : "";
      return "<td"+cls+">"+cellHTML(f[0], r[f[0]])+"</td>";
    }).join("");
    var tag = isV2(r) ? "<div class='tagv2'>V2</div>" : "<div class='tagv1'>V1</div>";
    return "<tr"+(ckOn?" class='picked'":"")+">"+ck+"<td class='idx'>"+(i+1)+tag+"</td>"+tds+"</tr>";
  }).join("");
  document.getElementById("tableHost").innerHTML =
    "<table><thead><tr>"+th+"</tr></thead><tbody>"+trs+"</tbody></table>";
  syncAllBox();
  updateDelBtn();
}

/* ---------- 勾选与删除 ---------- */
function toggleRow(el){
  var id = el.getAttribute("data-id");
  if(el.checked) SEL[id] = true; else delete SEL[id];
  el.closest("tr").className = el.checked ? "picked" : "";
  syncAllBox(); updateDelBtn();
}

function toggleAll(on){
  VIEW.forEach(function(r){ if(on) SEL[String(r.id)] = true; else delete SEL[String(r.id)]; });
  render();
}

function syncAllBox(){
  var box = document.getElementById("ckAll");
  if(!box) return;
  var total = VIEW.length, picked = 0;
  VIEW.forEach(function(r){ if(SEL[String(r.id)]) picked++; });
  box.checked = total > 0 && picked === total;
  box.indeterminate = picked > 0 && picked < total;
}

function pickedIds(){
  return ROWS.filter(function(r){ return SEL[String(r.id)]; }).map(function(r){ return r.id; });
}

function updateDelBtn(){
  var btn = document.getElementById("delBtn");
  if(!btn) return;
  var n = pickedIds().length;
  btn.disabled = n === 0;
  btn.textContent = n ? "删除选中 (" + n + ")" : "删除选中";
}

function deleteSelected(){
  var ids = pickedIds();
  if(!ids.length){ alert("请先勾选要删除的记录"); return; }
  var rows = ROWS.filter(function(r){ return SEL[String(r.id)]; });
  var preview = rows.slice(0,8).map(function(r,i){
    return (i+1) + ". " + (r.q1_name || "(无姓名)") + "  #" + r.id + "  " + fmtTime(r.created_at);
  }).join("\n");
  var more = rows.length > 8 ? "\n… 共 " + rows.length + " 条" : "";
  if(!confirm("⚠️ 即将永久删除以下 " + rows.length + " 条记录，删除后无法恢复！\n\n" +
              preview + more + "\n\n确认删除请点「确定」")) return;

  var btn = document.getElementById("delBtn");
  btn.disabled = true; btn.textContent = "删除中…";
  fetch(API + "?id=in.(" + ids.join(",") + ")", {
    method: "DELETE",
    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "Prefer": "return=minimal" }
  }).then(function(r){
    if(!r.ok){
      return r.json().then(function(err){
        var d = (err && (err.message || err.msg)) || "";
        throw new Error("HTTP " + r.status + (d ? "（" + d + "）" : ""));
      }, function(){ throw new Error("HTTP " + r.status); });
    }
    ROWS = ROWS.filter(function(r){ return !SEL[String(r.id)]; });
    SEL = {};
    stats(); render();
    alert("已删除 " + ids.length + " 条记录 ✅");
  }).catch(function(e){
    alert("删除失败：" + e.message + "\n\n（service_role 密钥才有删除权限，请确认用的是 Legacy service_role）");
    updateDelBtn();
  });
}

function exportCSV(){
  if(!VIEW.length){ alert("没有可导出的数据"); return; }
  var head = ["序号","问卷版本"].concat(FIELDS.map(function(f){return f[1];}));
  var lines = [head.join(",")];
  VIEW.forEach(function(r,i){
    var row = [i+1, (isV2(r) ? "V2选择版" : "V1开放版")].concat(FIELDS.map(function(f){
      var v = r[f[0]];
      if(f[0]==="created_at") v = fmtTime(v);
      v = String(v==null?"":v).replace(/"/g,'""');
      return '"'+v+'"';
    }));
    lines.push(row.join(","));
  });
  var blob = new Blob(["\ufeff"+lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  var d = new Date(), p=function(n){return n<10?"0"+n:n;};
  a.download = "问卷数据_"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

function logout(){
  KEY = ""; ROWS = []; VIEW = [];
  var inp = document.getElementById("keyInput"); if(inp) inp.value = "";
  document.getElementById("app").style.display = "none";
  document.getElementById("gate").style.display = "block";
  document.getElementById("gateMsg").textContent = "已清除密钥";
}

/* 回车即载入 */
document.getElementById("keyInput").addEventListener("keydown", function(e){
  if(e.key === "Enter") doLoad();
});
</script>
